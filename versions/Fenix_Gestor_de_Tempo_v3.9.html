const Sync={bkp:{},bkpPronto:false,bkpBusy:false,bkpErroAte:0,core:null,db:null,auth:null,acesso:null,mod:null,user:null,userAuth:null,perfil:null,admin:false,nPend:0,unPerfil:null,unsubs:[],nuvem:{},prim:{},estado:'local',msg:'',ultErro:0};
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
function disp(){
  let d=null;try{d=JSON.parse(lsGet('fenix_tempo_disp')||'null');}catch(e){}
  if(!d||!d.id){d={id:'d'+uid(),nome:''};lsSet('fenix_tempo_disp',JSON.stringify(d));}
  return d;
}
const outro=x=>!!(x&&x.dispId&&x.dispId!==disp().id);
function setEstado(e,msg){
  Sync.estado=e;Sync.msg=msg||'';
  const d=$('#nvd');if(d)d.className='s-'+e;
}
const TXT_ESTADO={local:'Somente neste aparelho',conectando:'Conectando…',ok:'Sincronizado',offline:'Sem internet — as alterações sobem quando voltar',pendente:'Aguardando aprovação do administrador',bloqueado:'Acesso bloqueado pelo administrador'};
const txtEstado=()=>Sync.msg||(Sync.estado==='erro'?'Erro na sincronização':(TXT_ESTADO[Sync.estado]||''));

/* fila (só para o caso de o módulo não estar carregado depois de a conta já ter sido usada aqui) */
function fila(col,id,op){
  if(!lsGet('fenix_tempo_sync_uid'))return;
  let f={};try{f=JSON.parse(lsGet('fenix_tempo_fila')||'{}');}catch(e){}
  (f[col]=f[col]||{})[id]=op;lsSet('fenix_tempo_fila',JSON.stringify(f));
}
function esvaziarFila(){
  let f={};try{f=JSON.parse(lsGet('fenix_tempo_fila')||'{}');}catch(e){}
  lsDel('fenix_tempo_fila');
  for(const col of Object.keys(f))for(const id of Object.keys(f[col])){
    if(f[col][id]==='del'){Sync.mod.excluir(col,id).catch(erroSync);continue;}
    const o=col==='cfg'?(id in S.cfg?{id,value:S.cfg[id]}:null):S[col].find(x=>x.id===id);
    if(o)Sync.mod.salvar(col,o).catch(erroSync);
  }
}
const adaptar=(col,o)=>col==='cfg'?(CFG_SYNC.includes(o.key)?{id:o.key,value:o.value}:null):o;
function empurrar(col,o){
  const x=adaptar(col,o);if(!x)return;
  if(Sync.mod)Sync.mod.salvar(col,x).catch(erroSync);else fila(col,x.id,'put');
}
function empurrarDel(col,id){
  if(col==='cfg'&&!CFG_SYNC.includes(id))return;
  if(Sync.mod)Sync.mod.excluir(col,id).catch(erroSync);else fila(col,id,'del');
}
function erroSync(e){
  const c=(e&&e.code)||'';
  if(c==='permission-denied'){setEstado('erro','Sem permissão no Firestore: publique a regra de dados_pessoais (veja Ajustes › Conta).');}
  else if(c!=='unavailable'&&Date.now()-Sync.ultErro>30000){Sync.ultErro=Date.now();toast('Sincronização: '+((e&&e.message)||c||'erro'));}
}

/* aplicar o que vem da nuvem */
const ord=o=>Array.isArray(o)?o.map(ord):(o&&typeof o==='object'?Object.keys(o).sort().reduce((a,k)=>(a[k]=ord(o[k]),a),{}):o);
const igual=(a,b)=>JSON.stringify(ord(a))===JSON.stringify(ord(b));
function aplicarDoc(col,x){
  if(col==='cfg'){
    if(!CFG_SYNC.includes(x.id)||S.cfg[x.id]===x.dados.value)return false;
    S.cfg[x.id]=x.dados.value;putLocal('cfg',{key:x.id,value:x.dados.value});return true;
  }
  const arr=S[col],i=arr.findIndex(o=>o.id===x.id),d={...x.dados,id:x.id};
  if(i>=0){
    if(igual(arr[i],d))return false;
    const o=arr[i];Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,d);putLocal(col,o);
  }else{arr.push(d);putLocal(col,d);}
  return true;
}
function removerDoc(col,id){
  if(col==='cfg')return false;
  const n=S[col].length;S[col]=S[col].filter(o=>o.id!==id);
  if(S[col].length===n)return false;
  delLocal(col,id);return true;
}
function aoNuvem(col,ms,meta){
  const mapa=Sync.nuvem[col]=Sync.nuvem[col]||new Map();let mudou=false;
  for(const x of ms){
    if(x.tipo==='removed'){mapa.delete(x.id);if(removerDoc(col,x.id))mudou=true;}
    else{mapa.set(x.id,x.dados);if(!x.pendente&&aplicarDoc(col,x))mudou=true;}
  }
  if(!meta.doCache){
    setEstado(navigator.onLine===false?'offline':'ok');
    if(!Sync.prim[col]){Sync.prim[col]=true;if(COLS.every(c=>Sync.prim[c])){mesclar();setTimeout(bkpAuto,4000);}}
  }
  if(mudou)renderSoon();
}
let rTimer=null,rAdiado=false;
function renderSoon(){
  clearTimeout(rTimer);
  rTimer=setTimeout(()=>{
    const a=document.activeElement;
    if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#view').contains(a)){rAdiado=true;return;}
    render();
  },120);
}
document.addEventListener('focusout',()=>{if(rAdiado){rAdiado=false;setTimeout(render,400);}});

/* primeira sincronização deste aparelho com esta conta: envia o que só existe aqui, sem duplicar */
async function mesclar(){
  const u=Sync.user;if(!u)return;
  try{
    if(lsGet('fenix_tempo_merge_'+u.uid)){lsSet('fenix_tempo_sync_uid',u.uid);esvaziarFila();return;}
    const nuv=c=>Sync.nuvem[c]||new Map(),nn=x=>String(x||'').trim().toLowerCase();
    const mapC={},mapT={};
    S.cats.filter(c=>!nuv('cats').has(c.id)).forEach(c=>{const a=[...nuv('cats').values()].find(x=>nn(x.nome)===nn(c.nome));if(a)mapC[c.id]=a.id;});
    S.tarefas.filter(t=>!nuv('tarefas').has(t.id)).forEach(t=>{const a=[...nuv('tarefas').values()].find(x=>nn(x.nome)===nn(t.nome));if(a)mapT[t.id]=a.id;});
    const C=id=>mapC[id]||id,T=id=>mapT[id]||id;
    S.tarefas.forEach(t=>{if(mapC[t.catId])t.catId=C(t.catId);});
    S.regs.forEach(r=>{if(mapC[r.catId])r.catId=C(r.catId);if(mapT[r.tarefaId])r.tarefaId=T(r.tarefaId);});
    S.rotinas.forEach(ro=>(ro.itens||[]).forEach(i=>{if(mapT[i.tarefaId])i.tarefaId=T(i.tarefaId);}));
    S.rotlog.forEach(l=>{if(l.seq&&l.seq.some(id=>mapT[id]))l.seq=l.seq.map(T);});
    for(const id of Object.keys(mapC))await delLocal('cats',id);
    for(const id of Object.keys(mapT))await delLocal('tarefas',id);
    S.cats=S.cats.filter(c=>!mapC[c.id]);S.tarefas=S.tarefas.filter(t=>!mapT[t.id]);
    for(const c of COLS){
      if(c==='cfg'){
        const its=CFG_SYNC.filter(k=>!nuv('cfg').has(k)&&k in S.cfg).map(k=>({id:k,value:S.cfg[k]}));
        if(its.length)await Sync.mod.salvarVarios('cfg',its);
        continue;
      }
      const its=S[c].filter(o=>!nuv(c).has(o.id));
      if(its.length){await Sync.mod.salvarVarios(c,its);for(const o of its)await putLocal(c,o);}
    }
    lsSet('fenix_tempo_merge_'+u.uid,new Date().toISOString());lsSet('fenix_tempo_sync_uid',u.uid);
    if(!S.cats.length)await semear();
    esvaziarFila();renderSoon();toast('Dados sincronizados com a nuvem');
  }catch(e){erroSync(e);}
}

/* conexão */
async function carregarCore(){
  if(window.__FENIX_CORE_TESTE)return {FenixCore:window.__FENIX_CORE_TESTE};
  const exig=['initFirebaseComCache','criarModuloAuth','criarModuloSincronia'].concat(MULTI?['criarModuloAcesso']:[]);
  let falta=null;
  for(const u of CORE_URLS){
    try{
      const m=await import(u),C=m.FenixCore||m.default||m,f=exig.filter(k=>typeof C[k]!=='function');
      if(!f.length){Sync.coreUrl=u;return {FenixCore:C};}
      if(!falta)falta={u,f};
    }catch(e){}
  }
  const er=new Error(falta?'core incompatível':'sem rede');er.falta=falta;throw er;
}
async function syncBoot(){
  try{Sync.core=(await carregarCore()).FenixCore;}
  catch(e){
    Sync.core=null;
    if(e&&e.falta)setEstado('erro','O fenix-core publicado ('+e.falta.u.split('/')[3]+') não tem: '+e.falta.f.join(', ')+'. Publique a versão completa em '+CORE_URLS[0]);
    else setEstado('local','Não foi possível carregar o fenix-core (sem internet?).');
    return;
  }
  const C=Sync.core;
  try{
    const r=C.initFirebaseComCache(MULTI?FIREBASE_CONFIG:undefined);Sync.db=r.db;Sync.auth=C.criarModuloAuth(r.app);
    if(MULTI)Sync.acesso=C.criarModuloAcesso(r.db);
    Sync.auth.aoMudarEstado(u=>{
      if(u){Sync.userAuth=u;if(MULTI)aoLogar(u);else syncIniciar(u);}
      else{
        Sync.userAuth=null;Sync.perfil=null;Sync.admin=false;Sync.nPend=0;badgePend();renderBanner();
        if(Sync.unPerfil){Sync.unPerfil();Sync.unPerfil=null;}
        syncParar();
        if(!lsGet('fenix_tempo_login_visto')){lsSet('fenix_tempo_login_visto','1');abrirConta();}
      }
    });
  }catch(e){setEstado('erro',String((e&&e.message)||e));}
}
/* multiusuário: o perfil (pendente / aprovado / bloqueado) decide se a sincronização liga */
async function aoLogar(u){
  if(Sync.user&&Sync.user.uid===u.uid&&Sync.mod)return;
  try{
    let p=await Sync.acesso.obter(u.uid);
    if(!p){await Sync.acesso.solicitar(u.uid,u.email,lsGet('fenix_tempo_nome_pend')||'');p=await Sync.acesso.obter(u.uid);}
    Sync.admin=await Sync.acesso.ehAdmin(u.uid);
    aplicarPerfil(u,p);
    if(Sync.unPerfil)Sync.unPerfil();
    Sync.unPerfil=Sync.acesso.ouvir(u.uid,p2=>aplicarPerfil(u,p2),erroSync);
    Sync.pendVisto=false;badgePend();
    if(Sync.admin)atualizarPend();
  }catch(e){erroSync(e);}
}
function aplicarPerfil(u,p){
  Sync.perfil=p;
  if(p&&p.status==='aprovado'){if(!Sync.mod)syncIniciar(u);return;}
  syncParar(true);setEstado(p&&p.status==='bloqueado'?'bloqueado':'pendente');
  if(ui.tab==='ajustes')render();
}
/* outra conta entrou em um aparelho que tem dados de uma conta anterior */
let cbX=null,escAberta=false;
function escolherDados(u){
  return new Promise(res=>{
    const antes=lsGet('fenix_tempo_sync_email');
    escAberta=true;cbX=()=>{escAberta=false;res('cancelar');};
    modal(`<h3>Outra conta neste aparelho</h3><p class="mut small" style="margin:6px 0 10px">Este aparelho tem dados ${antes?'da conta <b>'+esc(antes)+'</b>':'de outra conta'}. Você entrou como <b>${esc(u.email)}</b>. O que fazer com os dados que estão aqui?</p>
     <button class="btn gold block" id="ed_a">Usar só os dados desta conta</button><p class="mut small" style="margin:-4px 0 10px">Apaga os dados deste aparelho. Os da outra conta continuam na nuvem dela.</p>
     <button class="btn block" id="ed_m">Manter e enviar para esta conta</button><p class="mut small" style="margin:-4px 0 10px">Os dados deste aparelho passam a fazer parte desta conta.</p>
     <button class="link" id="ed_c">Cancelar e sair desta conta</button>`);
    const f=v=>()=>{if(v==='apagar'&&!confirm('Apagar os dados deste aparelho e usar só os da conta '+u.email+'?'))return;cbX=null;escAberta=false;fechar();res(v);};
    $('#ed_a').onclick=f('apagar');$('#ed_m').onclick=f('manter');$('#ed_c').onclick=f('cancelar');
  });
}
async function syncIniciar(u){
  if(Sync.user&&Sync.user.uid===u.uid&&Sync.mod)return;
  syncParar(true);
  const prev=lsGet('fenix_tempo_sync_uid');
  if(prev&&prev!==u.uid){
    const esc_=await escolherDados(u);
    if(esc_==='cancelar'){try{await Sync.auth.sair();}catch(e){}return;}
    if(esc_==='apagar'){
      for(const st of ['dias','cats','tarefas','regs','rotinas','rotlog'])await tx(st,'readwrite',s=>s.clear());
      S.dias=[];S.cats=[];S.tarefas=[];S.regs=[];S.rotinas=[];S.rotlog=[];lsDel('fenix_tempo_fila');lsDel('fenix_tempo_sync_uid');
    }
  }
  if(prev&&prev!==u.uid)lsDel('fenix_tempo_merge_'+u.uid); /* refaz a mesclagem: nada fica sem enviar nem duplicado */
  lsSet('fenix_tempo_sync_email',u.email||'');
  Sync.user=u;Sync.nuvem={};Sync.prim={};
  Sync.mod=Sync.core.criarModuloSincronia(Sync.db,u.uid,APP_ID);
  setEstado(navigator.onLine===false?'offline':'conectando');
  COLS.forEach(c=>Sync.unsubs.push(Sync.mod.ouvir(c,(m,meta)=>aoNuvem(c,m,meta),erroSync)));
  Sync.bkp={};Sync.bkpPronto=false;Sync.bkpBusy=false;Sync.bkpErroAte=0;
  Sync.unsubs.push(Sync.mod.ouvir(BK_META,(ms,meta)=>{
    for(const x of ms){if(x.tipo==='removed')delete Sync.bkp[x.id];else Sync.bkp[x.id]={...x.dados,id:x.id};}
    if(!meta.doCache)Sync.bkpPronto=true;
    if(ui.tab==='ajustes'&&!document.querySelector('#modal .sheet'))renderSoon();
  },erroSync));
  Sync.mod.medirRelogio().then(o=>{OFFSET=Math.abs(o)<2000?0:o;}).catch(()=>{});
  if(!disp().nome)setTimeout(()=>{if(Sync.user&&!disp().nome)abrirConta();},350);else if(ui.tab==='ajustes')render();
}
function syncParar(silencioso){
  Sync.unsubs.forEach(f=>{try{f();}catch(e){}});Sync.unsubs=[];Sync.mod=null;Sync.user=null;Sync.bkp={};Sync.bkpPronto=false;
  setEstado('local');if(!silencioso&&ui.tab==='ajustes')render();
}
window.addEventListener('online',()=>{if(Sync.mod)setEstado('conectando');});
window.addEventListener('offline',()=>{if(Sync.mod)setEstado('offline');});

/* ---------- Backup na nuvem (v3.4) ---------- */
const BK_META='bkp_meta',BK_DADOS='bkp_dados',BK_MAX=20,BK_CHUNK=600000;
const b64=u8=>{let t='';for(let i=0;i<u8.length;i+=8192)t+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(t);};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function lerStream(rs){const rd=rs.getReader(),ps=[];let n=0;for(;;){const {done,value}=await rd.read();if(done)break;ps.push(value);n+=value.length;}const o=new Uint8Array(n);let k=0;for(const x of ps){o.set(x,k);k+=x.length;}return o;}
async function comprimir(txt){
  if(typeof CompressionStream==='undefined'||typeof TextEncoder==='undefined')return {enc:'txt',d:txt};
  try{const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(txt));w.close();return {enc:'gz',d:b64(await lerStream(cs.readable))};}
  catch(e){return {enc:'txt',d:txt};}
}
async function descomprimir(enc,d){
  if(enc!=='gz')return d;
  const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(unb64(d));w.close();
  return new TextDecoder().decode(await lerStream(ds.readable));
}
const snapshotDados=()=>({app:'fenix-tempo',versao:VERSAO,dias:S.dias,cats:S.cats,tarefas:S.tarefas,regs:S.regs,rotinas:S.rotinas,rotlog:S.rotlog,cfg:S.cfg});
const dataLocal=ts=>{const d=new Date(ts);return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());};
async function bkpCriar(motivo){
  if(!Sync.mod)throw new Error('sem sincronização');
  const ts=agora(),d=new Date(ts),id=dataLocal(ts)+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+String(d.getMilliseconds()).padStart(3,'0');
  const c=await comprimir(JSON.stringify(snapshotDados())),n=Math.max(1,Math.ceil(c.d.length/BK_CHUNK));
  const partes=[];for(let i=0;i<n;i++)partes.push({id:id+'_'+i,bk:id,i,d:c.d.slice(i*BK_CHUNK,(i+1)*BK_CHUNK)});
  await Sync.mod.salvarVarios(BK_DADOS,partes);
  const meta={id,ts,motivo:motivo||'automático',enc:c.enc,n,bytes:c.d.length,dias:S.dias.length,regs:S.regs.length,tarefas:S.tarefas.length,aparelho:disp().nome||''};
  await Sync.mod.salvar(BK_META,meta);
  Sync.bkp[id]=meta;
  bkpPodar().catch(()=>{});
  return meta;
}
async function bkpPodar(){
  const lista=Object.values(Sync.bkp).sort((a,b)=>b.ts-a.ts);
  for(const m of lista.slice(BK_MAX)){
    await Sync.mod.excluir(BK_META,m.id);delete Sync.bkp[m.id];
    for(let i=0;i<(m.n||1);i++)await Sync.mod.excluir(BK_DADOS,m.id+'_'+i);
  }
}
/* um backup automático por dia, na primeira abertura com a nuvem em dia */
async function bkpAuto(){
  if(!Sync.mod||!Sync.bkpPronto||Sync.bkpBusy||Sync.estado!=='ok'||!S.dias.length)return;
  if(!COLS.every(c=>Sync.prim[c]))return;
  const now=agora();if(now<(Sync.bkpErroAte||0))return;
  const hoje0=dataLocal(now);
  if(Object.values(Sync.bkp).some(m=>dataLocal(m.ts)===hoje0))return;
  Sync.bkpBusy=true;
  try{await bkpCriar('automático');}catch(e){Sync.bkpErroAte=now+10*MIN;}
  Sync.bkpBusy=false;
  if(ui.tab==='ajustes'&&!document.querySelector('#modal .sheet'))renderSoon();
}
/* cópia de segurança antes de algo que apaga ou substitui dados (não bloqueia se falhar) */
async function bkpSeguranca(motivo){
  if(!Sync.mod||!S.dias.length)return;
  try{await Promise.race([bkpCriar(motivo),new Promise((_,rj)=>setTimeout(()=>rj(0),8000))]);}catch(e){}
}
function bkpCardHTML(){
  if(!Sync.mod)return '';
  const l=Object.values(Sync.bkp).sort((a,b)=>b.ts-a.ts),u=l[0];
  return `<div class="card"><h3>Backup na nuvem</h3><p class="mut small">Uma cópia por dia é guardada na sua conta (mantemos as ${BK_MAX} mais recentes). Se algo for apagado por engano, você restaura aqui.</p>
   <p class="small" style="margin:8px 0">${u?`Último backup: <b>${esc(fmtDataHora(u.ts))}</b> · ${l.length} guardado${l.length===1?'':'s'}`:(Sync.bkpPronto?'Ainda não há backup. O primeiro é feito automaticamente.':'Consultando…')}</p>
   <button class="btn block" id="bk_agora" onclick="bkpAgora()">Fazer backup agora</button><button class="btn block" onclick="abrirBackups()" ${l.length?'':'disabled'}>Ver backups e restaurar</button></div>`;
}
async function bkpAgora(){
  const b=$('#bk_agora');if(b)b.disabled=true;
  try{await bkpCriar('manual');toast('Backup feito');}catch(e){toast('Não foi possível fazer o backup agora.');}
  if(ui.tab==='ajustes')render();
}
const fmtKB=b=>b<1024?b+' B':(b/1024).toFixed(b<10240?1:0).replace('.',',')+' KB';
function abrirBackups(){
  const l=Object.values(Sync.bkp).sort((a,b)=>b.ts-a.ts);
  modal(`<h3>Backups na nuvem</h3><p class="mut small" style="margin-bottom:6px">Restaurar substitui os dados atuais (neste e nos outros aparelhos). Antes, o app guarda um backup do estado atual.</p>`
   +(l.length?l.map(m=>`<div class="item"><div style="flex:1"><b>${esc(fmtDataHora(m.ts))}</b><div class="mut small">${esc(m.motivo||'')}${m.aparelho?' · '+esc(m.aparelho):''}<br>${m.dias} dia${m.dias===1?'':'s'} · ${m.regs} registro${m.regs===1?'':'s'} · ${fmtKB(m.bytes||0)}</div></div><button class="btn small gold" onclick="restaurarBackup('${m.id}')">Restaurar</button></div>`).join(''):'<div class="empty">Nenhum backup ainda.</div>')
   +`<div class="erro" id="err"></div><button class="link" onclick="fechar()">Fechar</button>`);
}
/* lê as partes de um backup (a coleção é escutada só até chegar tudo) */
function bkpLer(m){
  return new Promise((ok,no)=>{
    const got={};let un=null,fim=false;
    const acaba=(f,v)=>{if(fim)return;fim=true;clearTimeout(tm);try{un&&un();}catch(e){}f(v);};
    const tm=setTimeout(()=>acaba(no,new Error('tempo esgotado')),30000);
    un=Sync.mod.ouvir(BK_DADOS,ms=>{
      for(const x of ms)if(x.tipo!=='removed'&&x.dados&&x.dados.bk===m.id)got[x.dados.i]=x.dados.d;
      if(Object.keys(got).length>=(m.n||1)){
        const t=[];for(let i=0;i<(m.n||1);i++)t.push(got[i]);
        acaba(ok,t.join(''));
      }
    },e=>acaba(no,e));
    if(fim&&un)try{un();}catch(e){}
  });
}
async function restaurarBackup(id){
  const m=Sync.bkp[id];if(!m||!Sync.mod)return;
  if(!confirm('Restaurar o backup de '+fmtDataHora(m.ts)+'?\n\nOs dados atuais serão SUBSTITUÍDOS por ele, neste e nos seus outros aparelhos. Antes, o app guarda um backup do estado atual.'))return;
  toast('Restaurando… aguarde');
  let j;
  try{
    const txt=await descomprimir(m.enc,await bkpLer(m));
    j=JSON.parse(txt);if(!validarBackup(j))throw new Error('inválido');
  }catch(e){erro('Não foi possível ler esse backup ('+((e&&e.message)||'erro')+'). Seus dados não foram alterados.');return;}
  await bkpSeguranca('antes de restaurar');
  try{await restaurarDados(j);}catch(e){erro('Falha ao restaurar. Tente de novo.');return;}
  fechar();toast('Backup restaurado');render();
}

/* conta */
const logadoAuth=()=>Sync.userAuth||Sync.user;
function contaCardHTML(){
  const u=logadoAuth();
  return `<div class="card"><h3>Conta e sincronização</h3><p class="small"><span class="dotst s-${Sync.estado}"></span>${esc(txtEstado())}</p>`
   +(u?`<p class="mut small" style="margin-top:4px">${esc(u.email)} · este aparelho: <b>${esc(disp().nome||'sem nome')}</b></p>`+(Sync.admin&&Sync.nPend?`<p class="small" style="margin-top:4px"><b>${Sync.nPend}</b> pedido${Sync.nPend===1?'':'s'} de acesso aguardando você.</p>`:''):`<p class="mut small" style="margin-top:4px">Entre para ver e encerrar suas tarefas em qualquer aparelho.</p>`)
   +`<button class="btn block" onclick="abrirConta()">${u?'Gerenciar conta':'Entrar na conta'}</button>`+(u&&Sync.auth?`<button class="btn block" onclick="sairConta()">Sair / trocar de conta</button>`:'')+`</div>`;
}
const LINK_PRIV='<a href="privacidade.html" target="_blank" rel="noopener" style="color:var(--navy2)">política de privacidade</a>';
function abrirConta(modo){
  const u=logadoAuth();let h=`<h3>☁ Conta e sincronização</h3>`;
  if(u){
    h+=`<p class="mut small">Conectado como</p><p><b>${esc(u.email)}</b></p><p class="small" style="margin:8px 0"><span class="dotst s-${Sync.estado}"></span>${esc(txtEstado())}</p>`
     +(Sync.estado==='pendente'?`<p class="mut small">Você pode usar o app normalmente neste aparelho. Quando for aprovado, a sincronização começa sozinha.</p>`:'')
     +`<label>Nome deste aparelho</label><input id="cn_disp" value="${esc(disp().nome)}" placeholder="Ex.: Celular S20, Tablet A16" maxlength="30" autocomplete="off">
     <p class="mut small" style="margin-top:4px">Aparece nas tarefas iniciadas aqui quando você as vê em outro aparelho.</p>
     <button class="btn gold block" onclick="salvarDisp()">Salvar</button>`
     +(Sync.admin?`<button class="btn block" onclick="abrirAprovacoes()">👥 Aprovações${Sync.nPend?' ('+Sync.nPend+')':''}</button>`:'')
     +`<button class="btn block" onclick="sairConta()">Sair ou trocar de conta</button>`
     +(MULTI?`<button class="btn danger block" onclick="abrirExclusao()">Excluir minha conta e dados</button><p class="small" style="text-align:center;margin-top:8px">${LINK_PRIV}</p>`:'')
     +`<button class="link" onclick="fechar()">Fechar</button>`;
  }else if(!Sync.auth){
    h+=`<p class="${Sync.estado==='erro'?'err':'mut'}" style="margin:8px 0">${esc(txtEstado()||'Carregando…')}</p><button class="btn block" onclick="fechar();syncBoot()">Tentar de novo</button><button class="link" onclick="fechar()">Continuar sem conta</button>`;
  }else if(modo==='criar'&&MULTI){
    h+=`<p class="mut small" style="margin-bottom:6px">Crie sua conta. O cadastro precisa ser aprovado pelo administrador antes de sincronizar; enquanto isso o app funciona neste aparelho.</p>
     <label>Seu nome</label><input id="cn_nome" maxlength="60" autocomplete="name">
     <label>E-mail</label><input id="cn_email" type="email" autocomplete="username" inputmode="email">
     <label>Senha (mínimo 6 caracteres)</label><input id="cn_senha" type="password" autocomplete="new-password">
     <div class="sw" style="margin-top:10px"><span>Li e aceito a ${LINK_PRIV}</span><input type="checkbox" id="cn_priv"></div>
     <div class="erro" id="err"></div><button class="btn gold block" id="cn_ok" onclick="criarContaApp()">Criar conta</button>
     <button class="link" onclick="abrirConta()">Já tenho conta</button>`;
  }else{
    h+=`<p class="mut small" style="margin-bottom:6px">${MULTI?'Entre com a sua conta. Seus dados ficam privados: só você os vê.':'Use a mesma conta do Fênix Core. Seus dados ficam privados: só você os vê.'}</p>
     <label>E-mail</label><input id="cn_email" type="email" autocomplete="username" inputmode="email">
     <label>Senha</label><input id="cn_senha" type="password" autocomplete="current-password">
     <div class="erro" id="err"></div><button class="btn gold block" id="cn_ok" onclick="entrarConta()">Entrar</button>
     <button class="link" onclick="esqueciSenha()">Esqueci a senha</button>`
     +(MULTI?`<button class="link" onclick="abrirConta('criar')">Não tenho conta — criar</button><p class="small" style="text-align:center">${LINK_PRIV}</p>`:'')
     +`<button class="link" onclick="fechar()">Continuar sem conta</button>`;
  }
  modal(h);
}
const MSG_AUTH={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.','auth/network-request-failed':'Sem conexão com a internet.','auth/email-already-in-use':'Este e-mail já tem conta. Use Entrar.','auth/weak-password':'Senha fraca: use ao menos 6 caracteres.'};
async function entrarConta(){
  const e=$('#cn_email').value.trim(),p=$('#cn_senha').value;
  if(!e||!p){erro('Informe e-mail e senha.');return;}
  const b=$('#cn_ok');b.disabled=true;
  try{await Sync.auth.entrar(e,p);if(!escAberta)fechar();toast('Conectado');}
  catch(x){b.disabled=false;erro(MSG_AUTH[x&&x.code]||'Não foi possível entrar ('+((x&&x.code)||'erro')+').');}
}
async function criarContaApp(){
  const n=($('#cn_nome').value||'').trim(),e=($('#cn_email').value||'').trim(),p=$('#cn_senha').value;
  if(!n){erro('Informe seu nome.');return;}
  if(!e||!p){erro('Informe e-mail e senha.');return;}
  if(p.length<6){erro('A senha precisa ter ao menos 6 caracteres.');return;}
  if(!$('#cn_priv').checked){erro('Aceite a política de privacidade para continuar.');return;}
  const b=$('#cn_ok');b.disabled=true;lsSet('fenix_tempo_nome_pend',n);
  try{await Sync.auth.criarConta(e,p);if(!escAberta)fechar();toast('Conta criada. Aguarde a aprovação.');}
  catch(x){b.disabled=false;erro(MSG_AUTH[x&&x.code]||'Não foi possível criar a conta ('+((x&&x.code)||'erro')+').');}
}
async function esqueciSenha(){
  const e=($('#cn_email').value||'').trim();if(!e){erro('Digite seu e-mail acima.');return;}
  try{await Sync.auth.recuperarSenha(e);toast('Enviamos um e-mail para redefinir a senha');}
  catch(x){erro(MSG_AUTH[x&&x.code]||'Não foi possível enviar o e-mail.');}
}
function salvarDisp(){
  const d=disp();d.nome=($('#cn_disp').value||'').trim();lsSet('fenix_tempo_disp',JSON.stringify(d));
  fechar();render();toast('Aparelho: '+(d.nome||'sem nome'));
}
function sairConta(){
  const u=logadoAuth();if(!u)return;
  modal(`<h3>Sair da conta</h3><p class="mut small" style="margin:6px 0 10px">Conectado como <b>${esc(u.email)}</b>. Ao sair, este aparelho deixa de sincronizar.</p>
   <button class="btn block" onclick="sairEfetivar('manter')">Sair e manter os dados neste aparelho</button>
   <button class="btn gold block" onclick="sairEfetivar('trocar')">Trocar de conta (sair e entrar com outra)</button>
   <button class="btn danger block" onclick="sairEfetivar('apagar')">Sair e apagar os dados deste aparelho</button>
   <p class="mut small" style="margin-top:6px">Apagar remove só os dados deste aparelho. Eles continuam na nuvem da conta e voltam quando você entrar de novo.</p><button class="link" onclick="fechar()">Cancelar</button>`);
}
async function sairEfetivar(modo){
  if(modo==='apagar'&&!confirm('Apagar os dados deste aparelho?\n\nEles continuam salvos na nuvem da conta'+(Sync.estado==='ok'?'.':', mas a sincronização não está em dia: o que ainda não subiu será perdido.')+'\n\nContinuar?'))return;
  fechar();
  syncParar(true); /* antes de qualquer limpeza, para não propagar exclusões para a nuvem */
  try{await Sync.auth.sair();}catch(e){}
  if(modo==='apagar'){
    for(const st of ['dias','cats','tarefas','regs','rotinas','rotlog','cfg'])await tx(st,'readwrite',s=>s.clear());
    S.dias=[];S.cats=[];S.tarefas=[];S.regs=[];S.rotinas=[];S.rotlog=[];
    lsDel('fenix_tempo_fila');lsDel('fenix_tempo_sync_uid');lsDel('fenix_tempo_sync_email');
    await semear();ui.hist=null;
  }
  render();
  if(modo==='trocar')setTimeout(()=>abrirConta(),250);
  else toast(modo==='apagar'?'Saiu da conta e apagou os dados deste aparelho':'Saiu da conta');
}
/* administrador: aviso de cadastros pendentes (selo no ☁, aviso no topo e consulta a cada 5 min) */
function badgePend(){
  const el=$('#npend');if(!el)return;
  const n=Sync.admin?Sync.nPend:0;el.hidden=!n;el.textContent=n>9?'9+':String(n);
  el.title=n?n+' pedido'+(n===1?'':'s')+' de acesso aguardando':'';
}
function aprAlertaHTML(){
  if(!Sync.admin||!Sync.nPend||(snooze.apr&&agora()<snooze.apr))return '';
  const n=Sync.nPend;
  return `<div class="alerta"><b>👥 ${n} pedido${n===1?'':'s'} de acesso aguardando você.</b><div class="acts"><button class="btn small navy" onclick="abrirAprovacoes()">Ver pedidos</button><button class="btn small" onclick="adiarApr()">Depois</button></div></div>`;
}
function adiarApr(){snooze.apr=agora()+2*3600000;renderBanner();}
let pendBusy=false;
async function atualizarPend(){
  if(!Sync.admin||!Sync.acesso||pendBusy||navigator.onLine===false)return;
  pendBusy=true;
  try{
    const l=await Sync.acesso.listar('pendente'),ant=Sync.nPend;
    Sync.nPend=l.length;
    if(l.length>ant&&Sync.pendVisto)toast(l.length>1?l.length+' pedidos de acesso aguardando você':'Novo pedido de acesso');
    Sync.pendVisto=true;
    if(l.length>ant)delete snooze.apr;
    badgePend();renderBanner();if(ui.tab==='ajustes'&&!document.querySelector('#modal .sheet'))renderSoon();
  }catch(e){}
  pendBusy=false;
}
/* administrador: aprovar e bloquear cadastros */
async function abrirAprovacoes(){
  modal(`<h3>👥 Aprovações</h3><p class="mut small">Carregando…</p>`);
  try{
    const ps=await Sync.acesso.listar(),ordem={pendente:0,bloqueado:1,aprovado:2},me=logadoAuth().uid;
    ps.sort((a,b)=>((ordem[a.status]||0)-(ordem[b.status]||0))||String(a.nome||a.email).localeCompare(String(b.nome||b.email)));
    Sync.nPend=ps.filter(p=>p.status==='pendente').length;badgePend();renderBanner();
    modal(`<h3>👥 Aprovações</h3>`+(ps.length?ps.map(p=>`<div class="item tw"><div style="flex:1;min-width:0"><b>${esc(p.nome||'(sem nome)')}</b><div class="mut small">${esc(p.email)} · ${esc(p.status)}</div></div>`
      +(p.status!=='aprovado'?`<button class="btn small gold" onclick="decidir('${esc(p.uid)}','aprovado')">Aprovar</button>`:'')
      +(p.status!=='bloqueado'&&p.uid!==me?`<button class="btn small danger" onclick="decidir('${esc(p.uid)}','bloqueado')">Bloquear</button>`:'')+`</div>`).join(''):'<div class="empty">Nenhum cadastro ainda.</div>')
      +`<button class="btn block" onclick="abrirConta()">Voltar</button>`);
  }catch(e){modal(`<h3>👥 Aprovações</h3><p class="err">Não foi possível carregar (${esc((e&&e.code)||'erro')}).</p><button class="btn block" onclick="abrirConta()">Voltar</button>`);}
}
async function decidir(uid,st){
  try{await Sync.acesso.definirStatus(uid,st,logadoAuth().uid);}catch(e){toast('Não foi possível salvar');return;}
  abrirAprovacoes();
}
/* excluir a própria conta e os dados na nuvem */
function abrirExclusao(){
  modal(`<h3>Excluir minha conta</h3><p class="mut small" style="margin:6px 0">Isso apaga a sua conta e todos os seus dados na nuvem (tarefas, registros, rotinas). Os dados que estão neste aparelho continuam nele. Não pode ser desfeito.</p>
   <label>Digite sua senha para confirmar</label><input id="ex_senha" type="password" autocomplete="current-password">
   <div class="erro" id="err"></div><button class="btn danger block" id="ex_ok" onclick="confirmarExclusao()">Excluir conta e dados</button><button class="link" onclick="abrirConta()">Cancelar</button>`);
}
async function confirmarExclusao(){
  const p=$('#ex_senha').value;if(!p){erro('Digite a senha.');return;}
  const b=$('#ex_ok');b.disabled=true;const me=logadoAuth().uid;
  try{await Sync.auth.reautenticar(p);}
  catch(x){b.disabled=false;erro(MSG_AUTH[x&&x.code]||'Senha incorreta.');return;}
  try{
    const m=Sync.mod||Sync.core.criarModuloSincronia(Sync.db,me,APP_ID);
    syncParar(true);
    await m.apagarTudo(COLS.concat(['sistema',BK_META,BK_DADOS]));
    try{await Sync.acesso.excluir(me);}catch(e){}
    await Sync.auth.excluirConta(p);
    lsDel('fenix_tempo_sync_uid');lsDel('fenix_tempo_merge_'+me);lsDel('fenix_tempo_fila');
    fechar();toast('Conta excluída. Os dados deste aparelho continuam nele.');
  }catch(x){b.disabled=false;erro('Não foi possível concluir ('+((x&&x.code)||'erro')+'). Tente de novo.');}
}

/* ---------- Inicialização ---------- */
async function semear(){
  const cats=[['c_higiene','Higiene','#3b82f6'],['c_refeicao','Refeição','#f59e0b'],['c_lazer','Lazer','#a855f7'],['c_estudo','Estudo','#10b981'],['c_trabalho','Trabalho','#6366f1'],['c_casa','Casa','#84cc16'],['c_saude','Saúde','#ef4444'],['c_descanso','Descanso','#14b8a6'],['c_outros','Outros','#94a3b8']];
  for(const [id,nome,cor] of cats){const c={id,nome,cor};S.cats.push(c);await put('cats',c);}
  const ts=[['Café da manhã','c_refeicao'],['Almoço','c_refeicao'],['Jantar','c_refeicao'],['Banho','c_higiene'],['Assistir TV','c_lazer'],['Estudar','c_estudo'],['Ler','c_estudo']];
  for(const [nome,cid] of ts){const t={id:uid(),nome,catId:cid};S.tarefas.push(t);await put('tarefas',t);}
}
async function boot(){
  try{db=await abrirDB();}catch(e){db=null;toast('Armazenamento indisponível: os dados não serão salvos');}
  if(db){
    S.dias=await all('dias');S.cats=await all('cats');S.tarefas=await all('tarefas');S.regs=await all('regs');S.rotinas=await all('rotinas');S.rotlog=await all('rotlog');
    (await all('cfg')).forEach(x=>{S.cfg[x.key]=x.value;});
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  }
  const off=Number(lsGet('fenix_relogio__'+APP_ID));if(isFinite(off)&&Math.abs(off)>=2000)OFFSET=off;
  if(!S.cats.length&&!lsGet('fenix_tempo_sync_uid'))await semear();
  render();checar();syncBoot();
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instalador=e;if(ui.tab==='ajustes')render();});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;}).catch(()=>{});}
boot();
