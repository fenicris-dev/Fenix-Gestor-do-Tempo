<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>FÊNIX | Gestor de Tempo</title>
<meta name="description" content="Gestor de tempo pessoal: cronometra o dia do Acordei ao Dormir e cada tarefa, com disciplina de encerramento.">
<meta name="theme-color" content="#041273">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--navy:#041273;--navy2:#1a2bb0;--gold:#d4a62a;--gold-d:#a67f12;--gold-l:#fbf1cf;--bg:#f3f4fa;--card:#fff;--txt:#161a33;--mut:#6a6f8f;--bd:#e3e5f0;--ok:#188a52;--warn:#c9741a;--err:#c5303a;--r:14px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior-y:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.35}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
header .lg{width:32px;height:32px;border-radius:8px;flex:none}
header .logo{font-weight:800;letter-spacing:.5px;font-size:17px}
header .logo b{color:var(--gold)}
header .ver{font-size:11px;background:rgba(255,255,255,.15);padding:2px 7px;border-radius:99px}
header .sp{flex:1}
header button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer}
.card h3,.sec{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:18px 2px 8px;font-weight:700}
.card h3{margin:0 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--mut)}.small{font-size:13px}.ok{color:var(--ok)}.err{color:var(--err)}
.hero{text-align:center;padding:40px 10px 24px}
.hero .sun{font-size:64px;line-height:1}
.hero h2{margin:8px 0 4px;color:var(--navy);font-size:26px}
.hero p{color:var(--mut);margin-bottom:22px}
button{font:inherit;cursor:pointer}
.big{border:0;border-radius:99px;padding:20px 54px;font-size:22px;font-weight:800;color:#fff;background:var(--navy);box-shadow:0 6px 18px rgba(4,18,115,.3)}
.big.gold{background:linear-gradient(135deg,#e7bb3d,var(--gold));color:#2b2100;box-shadow:0 6px 18px rgba(212,166,42,.4)}
.btn{border:1px solid var(--bd);background:#fff;color:var(--navy);padding:11px 16px;border-radius:12px;font-weight:700}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b2100}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--err);border-color:#f0c9cc}
.btn.small{padding:7px 12px;font-size:14px}
.btn.block{display:block;width:100%;margin-top:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--navy2);padding:10px 4px;text-decoration:underline;display:block;margin:6px auto 0}
.dia{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0}
.dia .clock{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.dia .mut{color:rgba(255,255,255,.75)}
.dia button.edit{background:none;border:0;color:var(--gold);text-decoration:underline;padding:0;font-size:13px}
.chip{display:inline-block;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:5px 11px;font-size:13px;margin:4px 6px 0 0;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips button.chip{cursor:pointer}
.st{display:inline-block;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 10px;font-size:13px;margin:8px 6px 0 0;cursor:pointer}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.run{border-left:5px solid var(--gold)}
.run .timer{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy)}
.badge{font-size:12px;border-radius:99px;padding:2px 8px;background:#fde8ea;color:var(--err);font-weight:700}
.banner{max-width:720px;margin:10px auto 0;padding:0 14px}
.alerta{background:var(--gold-l);border:1px solid #ecd48a;border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.alerta .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--navy);font-weight:800}
nav button.on i{filter:none}
#modal{position:fixed;inset:0;background:rgba(10,14,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal{overscroll-behavior:contain}
.sheet{overscroll-behavior:contain}
.xf{position:sticky;top:0;float:right;margin:-6px -6px 0 8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:#fff;color:var(--navy);font-size:18px;line-height:1;z-index:2;padding:0}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:20px}}
@media(max-width:430px){header{gap:8px}header .logo{font-size:15px;white-space:nowrap}header .ver{display:none}}
.sheet label.sw{display:flex;margin:12px 0 4px}
.sheet h3{color:var(--navy);margin-bottom:6px;font-size:20px}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px;font-weight:600}
input,select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:11px;background:#fff;color:var(--txt)}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;height:40px;width:54px}
.ask{background:var(--gold-l);border-radius:12px;padding:12px;margin:12px 0 4px;font-weight:700;color:#5a4300}
.erro{color:var(--err);font-size:14px;min-height:18px;margin-top:6px}
.lista .it{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.lista .it.off{opacity:.45;cursor:default}
.lista .it:last-child{border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut)}
.kpi span{display:block;font-size:20px;font-weight:800;color:var(--navy)}
.bar{margin:9px 0}
.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:3px}
.bar .tr{height:9px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px}
.tl{position:relative;background:var(--bg);border-radius:10px;margin:6px 0 2px}
.tl .seg{position:absolute;height:22px;border-radius:6px;color:#fff;font-size:11px;line-height:22px;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:clip;cursor:pointer;min-width:4px}
.tl .seg.aberta{outline:2px dashed rgba(0,0,0,.4)}
.axis{position:relative;height:18px;font-size:11px;color:var(--mut)}
.axis span{position:absolute;transform:translateX(-50%)}
.trend{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:6px}
.trend div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.trend i{display:block;width:100%;background:var(--err);border-radius:5px 5px 0 0;min-height:2px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.sw input[type=number]{width:90px}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.item input[type=text]{flex:1}
.item select{width:auto;max-width:140px}
.item.tw{flex-wrap:wrap;padding:10px 0}
.item.tw input[type=text]{flex:1 1 calc(100% - 128px);min-width:0}
.item.tw select{flex:1;max-width:none;min-width:0}
.run .btn{white-space:nowrap}
.run .row>div:first-child{min-width:0}
header button#nuvem{position:relative;padding:6px 10px}
#npend{position:absolute;left:-6px;top:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#ef5b66;color:#fff;font:700 11px/18px system-ui,sans-serif;text-align:center;border:1.5px solid var(--navy);box-sizing:border-box}
#nvd{position:absolute;right:3px;top:3px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--navy);background:#8a90b8}
#nvd.s-ok{background:#35c47a}#nvd.s-conectando,#nvd.s-offline,#nvd.s-pendente{background:#f0b13a}#nvd.s-erro,#nvd.s-bloqueado{background:#ef5b66}
.dotst{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:#8a90b8}
.dotst.s-ok{background:#35c47a}.dotst.s-conectando,.dotst.s-offline,.dotst.s-pendente{background:#f0b13a}.dotst.s-erro,.dotst.s-bloqueado{background:#ef5b66}
.devtag{display:inline-block;background:#e8ecff;color:var(--navy);border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:80;max-width:90%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
ul.cl{padding-left:18px;margin:6px 0}ul.cl li{margin:3px 0;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
</style>

<body>
<header>
  <img class="lg" src="icon-192.png" alt="" width="32" height="32">
  <div class="logo">FÊNIX <b>|</b> Gestor de Tempo</div>
  <span class="ver">v3.9</span>
  <div class="sp"></div>
  <button id="nuvem" onclick="abrirConta()" title="Conta e sincronização">☁<i id="nvd" class="s-local"></i><b id="npend" hidden></b></button>
  <button onclick="abrirSobre()">Sobre</button>
</header>
<div class="banner" id="banner"></div>
<main id="view"></main>
<nav id="nav">
  <button data-t="hoje" onclick="go('hoje')"><i>⏱</i>Hoje</button>
  <button data-t="hist" onclick="go('hist')"><i>🗓</i>Histórico</button>
  <button data-t="rel" onclick="go('rel')"><i>📊</i>Relatórios</button>
  <button data-t="ajustes" onclick="go('ajustes')"><i>⚙</i>Ajustes</button>
</nav>
<div id="modal"></div>

<script>
'use strict';
/* ===== FÊNIX | Gestor de Tempo v3.9 ===== */
const VERSAO='3.9';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let OFFSET=0;const agora=()=>Date.now()+OFFSET;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MIN=60000,DIA=86400000;

/* ---------- Armazenamento (IndexedDB) ---------- */
let db=null;
const S={dias:[],cats:[],tarefas:[],regs:[],rotinas:[],rotlog:[],cfg:{limiteMin:60,repetirMin:30,lembretes:true,notif:false}};
const ui={tab:'hoje',hist:null,per:'7',off:0,ntNome:'',ntCat:null};
const snooze={},notif={};
let swReg=null,instalador=null;

function abrirDB(){return new Promise((res,rej)=>{
  const q=indexedDB.open('fenixTempoDB',2);
  q.onupgradeneeded=()=>{const d=q.result;['dias','cats','tarefas','regs','rotinas','rotlog'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});});if(!d.objectStoreNames.contains('cfg'))d.createObjectStore('cfg',{keyPath:'key'});};
  q.onblocked=()=>toast('Feche as outras abas do app para concluir a atualização');
  q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
});}
function tx(st,modo,fn){
  if(!db)return Promise.resolve([]);
  return new Promise((res,rej)=>{
    const t=db.transaction(st,modo);const r=fn(t.objectStore(st));
    t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
}
const putLocal=(st,o)=>tx(st,'readwrite',s=>s.put(o));
const delLocal=(st,id)=>tx(st,'readwrite',s=>s.delete(id));
const all=st=>tx(st,'readonly',s=>s.getAll());
/* put/del/clear: gravam no aparelho e empurram para a nuvem (v2.0) */
const put=(st,o)=>{empurrar(st,o);return putLocal(st,o);};
const del=(st,id)=>{empurrarDel(st,id);return delLocal(st,id);};
const clear=async st=>{if(st!=='cfg')(await all(st)).forEach(o=>empurrarDel(st,o.id));return tx(st,'readwrite',s=>s.clear());};

/* ---------- Formatação ---------- */
const pad=n=>String(n).padStart(2,'0');
function fmtDur(ms){ms=Math.max(0,ms);if(ms<MIN)return '<1min';const t=Math.round(ms/MIN),h=Math.floor(t/60),m=t%60;if(h&&m)return h+'h '+pad(m)+'min';if(h)return h+'h';return m+'min';}
function fmtClock(ms){const s=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);}
const fmtHM=ts=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fmtData=ts=>new Date(ts).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
const fmtDataHora=ts=>fmtData(ts)+' '+fmtHM(ts);
function toLocal(ts){const d=new Date(ts-new Date(ts).getTimezoneOffset()*MIN);return d.toISOString().slice(0,16);}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}

/* ---------- Acesso aos dados ---------- */
const OUTROS={id:'c_outros',nome:'Outros',cor:'#94a3b8'};
const diaAberto=()=>S.dias.find(d=>d.fim==null);
const reg=id=>S.regs.find(r=>r.id===id);
const tarefa=id=>S.tarefas.find(t=>t.id===id);
const catId=id=>S.cats.find(c=>c.id===id)||OUTROS;
/* ordem alfabética (pt-BR, sem diferenciar maiúsculas/acentos) para toda lista de busca (v3.8) */
const cmpNome=(a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR',{sensitivity:'base',numeric:true});
const porNome=a=>a.slice().sort(cmpNome);
const tarOrd=()=>porNome(S.tarefas),catsOrd=()=>porNome(S.cats),rotOrd=()=>porNome(S.rotinas);
const semAc=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function catDe(r){const t=tarefa(r.tarefaId);return catId(t?t.catId:r.catId);}
const usos=id=>S.regs.filter(r=>r.tarefaId===id).length;

function tipico(tid){
  const m={};S.regs.filter(r=>r.tarefaId===tid&&!r.inst).forEach(r=>{(m[sessKey(r)]=m[sessKey(r)]||[]).push(r);});
  const ds=Object.values(m).filter(g=>g.every(r=>r.fim&&!r.esqueceu)&&!g.slice().sort((a,b)=>b.inicio-a.inicio)[0].pausada).map(g=>g.reduce((a,r)=>a+(r.fim-r.inicio),0)).sort((a,b)=>a-b);
  return ds.length<3?null:ds[Math.floor(ds.length/2)];
}
function limite(r){const t=tipico(r.tarefaId);return t?Math.max(t*1.5,t+10*MIN,10*MIN):S.cfg.limiteMin*MIN;}

/* ---------- Estatísticas ---------- */
function uniao(iv){
  iv=iv.filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]);
  let tot=0,cs=null,ce=null;
  for(const [s,e] of iv){if(cs===null){cs=s;ce=e;}else if(s<=ce){ce=Math.max(ce,e);}else{tot+=ce-cs;cs=s;ce=e;}}
  if(cs!==null)tot+=ce-cs;return tot;
}
function clip(r,d,now){const fim=d.fim==null?now:d.fim;return [Math.max(r.inicio,d.inicio),Math.min(r.fim==null?now:r.fim,fim)];}
function statsDia(d,now){
  now=now||agora();const fim=d.fim==null?now:d.fim;
  const regs=S.regs.filter(r=>r.diaId===d.id);
  const iv=regs.map(r=>clip(r,d,now));
  const soma=iv.reduce((a,x)=>a+Math.max(0,x[1]-x[0]),0);
  const un=uniao(iv),acordado=Math.max(0,fim-d.inicio);
  return {regs,acordado,soma,un,sem:Math.max(0,acordado-un),par:Math.max(0,soma-un),erros:regs.filter(r=>r.esqueceu)};
}
function catTotais(regs,d,now){
  const m={};
  regs.forEach(r=>{const c=catDe(r),x=clip(r,d,now),ms=Math.max(0,x[1]-x[0]);(m[c.id]=m[c.id]||{nome:c.nome,cor:c.cor,ms:0}).ms+=ms;});
  return Object.values(m).sort((a,b)=>b.ms-a.ms);
}
function barras(lista){
  const tot=lista.reduce((a,x)=>a+x.ms,0);
  if(!tot)return '<p class="mut small">Nenhuma tarefa registrada.</p>';
  return lista.map(x=>{const p=Math.round(x.ms/tot*100);return `<div class="bar"><div class="t"><span><span class="dot" style="background:${esc(x.cor)}"></span>${esc(x.nome)}</span><span class="mut">${fmtDur(x.ms)} · ${p}%</span></div><div class="tr"><i style="width:${p}%;background:${esc(x.cor)}"></i></div></div>`;}).join('');
}
function resumoHTML(d){
  const st=statsDia(d),tot=catTotais(st.regs,d,agora()),mh=metasHTML(d);
  return `<div class="grid"><div class="kpi"><span>${fmtDur(st.acordado)}</span>acordado</div><div class="kpi"><span>${fmtDur(st.soma)}</span>em tarefas</div><div class="kpi"><span>${fmtDur(st.sem)}</span>sem registro</div><div class="kpi"><span>${st.erros.length}</span>distrações</div></div>`
   +(st.par>MIN?`<p class="mut small" style="margin-bottom:8px">${fmtDur(st.par)} de tarefas rodaram em paralelo.</p>`:'')+barras(tot)
   +(mh?`<div class="sec" style="margin-top:14px">Metas do dia</div>${mh}`:'');
}

/* ---------- Metas por tarefa ---------- */
function tempoTarefaDia(tid,d,now){
  now=now||agora();
  return S.regs.filter(r=>r.diaId===d.id&&r.tarefaId===tid).reduce((a,r)=>{const x=clip(r,d,now);return a+Math.max(0,x[1]-x[0]);},0);
}
const comMeta=()=>tarOrd().filter(t=>t.meta&&t.meta.min>0);
function metaTxt(t){return t.meta&&t.meta.min>0?(t.meta.tipo==='max'?'até ':'')+fmtDur(t.meta.min*MIN):'';}
function metaStatus(t,ms){
  const alvo=t.meta.min*MIN,max=t.meta.tipo==='max';
  return {ok:max?ms<=alvo:ms>=alvo,estourou:max&&ms>alvo,pct:Math.min(100,ms/alvo*100)};
}
function metasHTML(d,now){
  now=now||agora();
  return comMeta().map(t=>{
    const ms=tempoTarefaDia(t.id,d,now),s=metaStatus(t,ms),c=catId(t.catId),max=t.meta.tipo==='max';
    const cor=s.estourou?'var(--err)':(!max&&s.ok?'var(--ok)':esc(c.cor));
    const rot=max?(s.estourou?'passou do limite':'dentro do limite'):(s.ok?'meta cumprida ✔':'faltam '+fmtDur(t.meta.min*MIN-ms));
    return `<div class="bar"><div class="t"><span><span class="dot" style="background:${esc(c.cor)}"></span>${esc(t.nome)} <span class="mut small">${max?'máx.':'mín.'} ${fmtDur(t.meta.min*MIN)}</span></span><span class="${s.estourou?'err':(!max&&s.ok?'ok':'mut')}">${fmtDur(ms)} · ${rot}</span></div><div class="tr"><i style="width:${Math.round(s.pct)}%;background:${cor}"></i></div></div>`;}).join('');
}
function metasAoVivo(){const el=$('#metas'),d=diaAberto();if(el&&d&&ui.tab==='hoje')el.innerHTML=metasHTML(d);}
function metasRelHTML(ds,now){
  const ts=comMeta();if(!ts.length||!ds.length)return '';
  const lin=ts.map(t=>{
    let lista=ds.slice();
    const ult=lista[lista.length-1];
    if(ult.fim==null&&!metaStatus(t,tempoTarefaDia(t.id,ult,now)).ok)lista.pop(); /* hoje ainda em andamento não conta como falha */
    if(!lista.length)return `<div class="item"><div style="flex:1"><b>${esc(t.nome)}</b><div class="mut small">${t.meta.tipo==='max'?'máx.':'mín.'} ${fmtDur(t.meta.min*MIN)} por dia</div></div><span class="mut small">sem dias fechados</span></div>`;
    const res=lista.map(d=>metaStatus(t,tempoTarefaDia(t.id,d,now)).ok);
    const ok=res.filter(Boolean).length;

  return `<div class="card"><h3>Metas</h3>${lin}</div>`;
}

/* ---------- Repetição por tarefa (v3.5) ---------- */
/* t.rep = {modo:'vezes',n,per:'dia'|'sem',reg:'toque'|'cron',desde} | {modo:'dias',dias:[0..6],desde} | {modo:'ciclo',cada,desde}; rep.pulo = quando pulou */
const ini0=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();};
const maisDias=(ts,n)=>{const d=new Date(ts);d.setDate(d.getDate()+n);return d.getTime();};
const iniSemana=ts=>maisDias(ini0(ts),-((new Date(ts).getDay()+6)%7));
function repTxt(t){
  const r=t.rep;if(!r)return '';
  if(r.modo==='vezes')return r.n+'×/'+(r.per==='sem'?'sem':'dia');
  if(r.modo==='dias')return r.dias.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(i=>DSEM[i]).join('·')+(r.doses?' · '+r.doses.n+'×/dia':'');
  if(r.modo==='ciclo')return 'a cada '+r.cada+'d';
  return '';
}
function ultFeito(t){let m=(t.rep&&t.rep.pulo)||0;for(const r of S.regs)if(r.tarefaId===t.id&&r.inicio>m)m=r.inicio;return m;}
const hmTs=(h0,hm)=>{const [h,m]=String(hm).split(':').map(Number),d=new Date(h0);d.setHours(h||0,m||0,0,0);return d.getTime();};
const ocorrencias=(t,de,ate)=>S.regs.filter(r=>r.tarefaId===t.id&&!r.retomaDe&&r.inicio>=de&&r.inicio<ate).length;
/* situação da repetição agora; null = não aparece hoje */
function repStatus(t,now){
  const r=t.rep;if(!r)return null;now=now||agora();
  const h0=ini0(now),desde0=ini0(r.desde||0);
  if(r.modo==='vezes'){
    const de=r.per==='sem'?iniSemana(now):h0,ate=maisDias(de,r.per==='sem'?7:1),cont=ocorrencias(t,de,ate);
    return {modo:'vezes',cont,meta:r.n,feito:cont>=r.n,pend:cont<r.n,atraso:0,txt:cont+'/'+r.n+(r.per==='sem'?' na semana':' hoje')};
  }
  if(r.modo==='dias'&&r.doses){
    if(h0<desde0||!r.dias.includes(new Date(h0).getDay()))return null;
    const D=r.doses,n=D.n,tom=ocorrencias(t,h0,maisDias(h0,1)),pul=(r.puladas&&r.puladas[dataLocal(h0)])||0,cont=Math.min(n,tom+pul);
    if(cont>=n)return {modo:'dias',doses:true,feito:true,pend:false,devida:false,atraso:0,cont:tom,meta:n,txt:tom+'/'+n+' hoje'};
    let devida=false,prox=null,txt=tom+'/'+n+' hoje';
    if(D.tipo==='horarios'){
      prox=hmTs(h0,D.horarios[cont]);devida=now>=prox;
      txt+=devida?(now-prox>=30*MIN?' · atrasada desde ':' · agora, das ')+D.horarios[cont]:' · próxima às '+D.horarios[cont];
    }else if(D.tipo==='intervalo'){
      const ult=S.regs.filter(x=>x.tarefaId===t.id&&!x.retomaDe&&x.inicio>=h0&&x.inicio<maisDias(h0,1)).reduce((m,x)=>Math.max(m,x.inicio),0);
      prox=ult?ult+D.intervaloMin*MIN:0;devida=now>=prox;
      txt+=devida?' · pode tomar agora':' · próxima a partir das '+fmtHM(prox);
    }
    return {modo:'dias',doses:true,feito:false,pend:true,devida,prox,atraso:0,cont:tom,meta:n,txt};
  }
  if(r.modo==='dias'){
    let L=null;
    for(let k=0;k<14;k++){const dt=maisDias(h0,-k);if(dt<desde0)break;if(r.dias.includes(new Date(dt).getDay())){L=dt;break;}}
    if(L===null)return null;
    const feito=ultFeito(t)>=L,atraso=Math.round((h0-L)/DIA);
    if(feito)return atraso===0?{modo:'dias',feito:true,pend:false,atraso:0,txt:'feito hoje'}:null;
    return {modo:'dias',feito:false,pend:true,atraso,txt:atraso===0?'para hoje':'atrasada há '+atraso+' dia'+(atraso===1?'':'s')};
  }
  if(r.modo==='ciclo'){
    const u=ultFeito(t);
    if(u&&ini0(u)===h0)return {modo:'ciclo',feito:true,pend:false,atraso:0,txt:'feito hoje'};
    const venc=u?maisDias(ini0(u),r.cada):h0,atraso=Math.max(0,Math.round((h0-venc)/DIA));
    if(h0<venc)return null;
    return {modo:'ciclo',feito:false,pend:true,atraso,txt:atraso===0?'vence hoje':'atrasada há '+atraso+' dia'+(atraso===1?'':'s')};
  }
  return null;
}
function proximaCiclo(t){const u=ultFeito(t);return u?maisDias(ini0(u),t.rep.cada):null;}
function repItens(){
  const now=agora();
  return S.tarefas.filter(t=>t.rep).map(t=>({t,s:repStatus(t,now)})).filter(x=>x.s)
   .sort((a,b)=>(b.s.devida?1:0)-(a.s.devida?1:0)||(b.s.pend&&b.s.atraso>0)-(a.s.pend&&a.s.atraso>0)||(b.s.pend?1:0)-(a.s.pend?1:0)||b.s.atraso-a.s.atraso||cmpNome(a.t,b.t));
}

      return `<div class="item" style="display:block"><div class="row" style="gap:8px;align-items:flex-start"><div style="flex:1;min-width:0">${nome}<div class="small"><span class="mut">${sub} · </span><span class="${s.devida?'err':(s.feito?'ok':'mut')}">${esc(s.txt)}${s.feito?' ✔':''}</span></div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${btn}${ult?`<button class="btn small" onclick="desfazerFeito('${t.id}')" title="Desfazer o último" aria-label="Desfazer">↩</button>`:''}</div></div><div class="tr" style="height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:5px"><i style="display:block;height:100%;width:${pct}%;background:${s.feito?'var(--ok)':esc(c.cor)}"></i></div></div>`;
    }
    if(s.feito)return `<div class="item"><div style="flex:1">${nome}<div class="small"><span class="mut">${sub} · </span><span class="ok">${esc(s.txt)} ✔</span></div></div></div>`;
    return `<div class="item"><div style="flex:1;min-width:0">${nome}<div class="small"><span class="mut">${sub} · </span><span class="${cor}">${esc(s.txt)}</span></div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${aberta?`<span class="mut small">em andamento</span>`:`<button class="btn small gold" onclick="iniciar('${t.id}')">▶ Iniciar</button>`}<button class="btn small" onclick="marcarFeito('${t.id}')">✔ Já fiz</button><button class="btn small" onclick="pularRep('${t.id}')">Pular</button></div></div>`;
  }).join('')+`</div>`;
}
async function marcarFeito(tid){
  const d=diaAberto(),t=tarefa(tid);if(!t)return;
  if(!d){toast('Toque em “Acordei” para começar o dia.');return;}
  const now=agora(),r={id:uid(),diaId:d.id,tarefaId:t.id,nome:t.nome,catId:t.catId,inicio:Math.max(d.inicio,now),fim:Math.max(d.inicio,now),esqueceu:false,marcadoEm:now,atrasoMs:0,inst:true,dispId:disp().id,dispNome:disp().nome||''};
  S.regs.push(r);await put('regs',r);delete snooze['rep_'+tid];
  const s=repStatus(t);toast('“'+t.nome+'”'+(s&&s.modo==='vezes'?' · '+s.txt:' · feito'));render();

/* registrar uma dose; antes do horário ou do intervalo pede confirmação */
async function tomarDose(tid){
  const t=tarefa(tid),s=t&&repStatus(t);
  if(s&&s.doses&&!s.feito&&!s.devida&&s.prox){
    const falta=s.prox-agora();
    if(t.rep.doses.tipo==='intervalo'&&!confirm('Ainda faltam '+fmtDur(falta)+' do intervalo mínimo entre doses (próxima a partir das '+fmtHM(s.prox)+').\n\nRegistrar “'+t.nome+'” mesmo assim?'))return;
    if(t.rep.doses.tipo==='horarios'&&falta>60*MIN&&!confirm('Esta dose está prevista para '+fmtHM(s.prox)+'.\n\nRegistrar “'+t.nome+'” agora?'))return;

let repHorTmp=[];
function repDoses(){

  if(tp==='horarios'){

    for(let i=0;i<n;i++){const v=repHorTmp[i]||(n===1?'08:00':hhmm(480+Math.round(i*720/(n-1))));h+=`<input type="time" value="${v}" style="width:auto;margin:4px 6px 0 0">`;}

function repCampos(){
  const m=$('#rp_modo').value;

  if(m==='dias')repDoses();

}
async function salvarRep(id){
  const t=tarefa(id);if(!t)return;const m=$('#rp_modo').value,ant=t.rep;let rep=null;
  if(m==='vezes'){const n=parseInt($('#rp_n').value,10);if(!(n>=1&&n<=99)){erro('Informe quantas vezes (1 a 99).');return;}rep={modo:'vezes',n,per:$('#rp_per').value==='sem'?'sem':'dia',reg:$('#rp_reg').value==='cron'?'cron':'toque'};}
  else if(m==='dias'){
    const dias=[0,1,2,3,4,5,6].filter(i=>$('#rp_d'+i).checked);if(!dias.length){erro('Marque pelo menos um dia.');return;}
    rep={modo:'dias',dias};
    const dn=parseInt($('#rp_dn').value,10),tp=$('#rp_dt').value;
    if(!(dn>=1&&dn<=12)){erro('Informe quantas vezes por dia (1 a 12).');return;}
    if(dn>1||tp!=='livre'){
      const D={n:dn,tipo:tp};
      if(tp==='horarios'){
        const hs=[...document.querySelectorAll('#rp_dh input')].map(i=>i.value);
        if(hs.length!==dn||hs.some(v=>!v)){erro('Preencha o horário de cada vez.');return;}
        const o=hs.slice().sort();if(o.some((v,i)=>i&&v===o[i-1])){erro('Há horários repetidos.');return;}
        D.horarios=o;
      }else if(tp==='intervalo'){
        const M=(parseInt($('#rp_dih').value,10)||0)*60+(parseInt($('#rp_dim').value,10)||0);
        if(M<10){erro('O intervalo mínimo deve ser de pelo menos 10 minutos.');return;}
        if((dn-1)*M>1380){erro('Com esse intervalo, as '+dn+' vezes não cabem em um dia.');return;}
        D.intervaloMin=M;
      }
      rep.doses=D;rep.reg=$('#rp_dreg').value==='cron'?'cron':'toque';
    }
  }
  else if(m==='ciclo'){const c=parseInt($('#rp_cada').value,10);if(!(c>=1&&c<=365)){erro('Informe o intervalo em dias (1 a 365).');return;}rep={modo:'ciclo',cada:c};}
  if(rep){rep.desde=ant&&ant.modo===rep.modo&&ant.desde?ant.desde:agora();if(ant&&ant.pulo&&ant.modo===rep.modo)rep.pulo=ant.pulo;if(ant&&ant.puladas&&rep.doses)rep.puladas=ant.puladas;t.rep=rep;}else delete t.rep;
  await put('tarefas',t);fechar();render();
}
/* relatório de repetições */
function repRelHTML(ds,now){
  const ts=tarOrd().filter(t=>t.rep);if(!ts.length||!ds.length)return '';
  const datas=new Set(ds.map(d=>dataLocal(d.inicio))),a=ini0(ds[0].inicio),b=ini0(Math.max(...ds.map(d=>d.fim||now)));
  const f1=v=>v.toFixed(1).replace('.',',');
  const linhas=ts.map(t=>{
    const r=t.rep,regs=S.regs.filter(x=>x.tarefaId===t.id&&!x.retomaDe&&datas.has(dataLocal(x.inicio))),cab=`<b>${esc(t.nome)}</b><div class="mut small">${esc(repTxt(t))}</div>`;
    let res='';
    if(r.modo==='vezes'&&r.per==='dia'){
      const por={};regs.forEach(x=>{const k=dataLocal(x.inicio);por[k]=(por[k]||0)+1;});
      const dias=[...datas],ok=dias.filter(k=>(por[k]||0)>=r.n).length;
      res=`<b class="${ok===dias.length?'ok':''}">${ok}/${dias.length} dias</b><div class="mut small">média ${f1(regs.length/dias.length)}/dia</div>`;
    }else if(r.modo==='vezes'){
      const sem=new Set(ds.map(d=>iniSemana(d.inicio)));
      res=`<b>${f1(regs.length/sem.size)}/semana</b><div class="mut small">meta ${r.n}</div>`;
    }else if(r.modo==='dias'){
      const prog=[];for(let dt=a;dt<=b;dt=maisDias(dt,1))if(dt>=ini0(r.desde||0)&&r.dias.includes(new Date(dt).getDay()))prog.push(dt);
      if(r.doses){
        const n=r.doses.n,por={},h0=ini0(now);S.regs.filter(x=>x.tarefaId===t.id&&!x.retomaDe).forEach(x=>{const k=dataLocal(x.inicio);por[k]=(por[k]||0)+1;});
        const dd=prog.filter(dt=>dt!==h0||(por[dataLocal(dt)]||0)>=n);
        let tom=0,cheios=0;dd.forEach(dt=>{const c=Math.min(por[dataLocal(dt)]||0,n);tom+=c;if(c>=n)cheios++;});
        return `<div class="item"><div style="flex:1">${cab}</div><div style="text-align:right">${dd.length?`<b class="${cheios===dd.length?'ok':''}">${tom}/${n*dd.length} vezes</b><div class="mut small">${cheios}/${dd.length} dias completos</div>`:(prog.length?`<span class="mut small">hoje em andamento · ${Math.min(por[dataLocal(h0)]||0,n)}/${n}</span>`:'<span class="mut small">sem dias programados</span>')}</div></div>`;
      }
      const ok=prog.filter((dt,i)=>{const fim=i+1<prog.length?prog[i+1]:maisDias(dt,7);return S.regs.some(x=>x.tarefaId===t.id&&!x.retomaDe&&x.inicio>=dt&&x.inicio<fim);}).length;
      res=prog.length?`<b class="${ok===prog.length?'ok':''}">${ok}/${prog.length} dias</b><div class="mut small">programados</div>`:`<span class="mut small">sem dias programados</span>`;
    }else{
      const ini=regs.map(x=>x.inicio).sort((p,q)=>p-q),iv=[];for(let i=1;i<ini.length;i++)iv.push((ini0(ini[i])-ini0(ini[i-1]))/DIA);
      res=`<b>${regs.length}×</b><div class="mut small">${iv.length?'intervalo médio '+f1(iv.reduce((x,y)=>x+y,0)/iv.length)+' dias · meta '+r.cada:'meta a cada '+r.cada+' dias'}</div>`;
    }
    return `<div class="item"><div style="flex:1">${cab}</div><div style="text-align:right">${res}</div></div>`;
  }).join('');
  return `<div class="card"><h3>Repetições</h3>${linhas}</div>`;
}

/* ---------- Rotinas (v1.3) ---------- */
const dataKey=ts=>toLocal(ts).slice(0,10);
const DSEM=['dom','seg','ter','qua','qui','sex','sáb'];
function diasTxt(a){const s=a.slice().sort().join();return a.length===7?'todos os dias':s==='1,2,3,4,5'?'seg–sex':s==='0,6'?'fim de semana':a.slice().sort().map(d=>DSEM[d]).join(', ');}
function resumoRotina(ro){const n=ro.itens.filter(i=>i.ativo&&tarefa(i.tarefaId)).length;return n+' tarefa'+(n===1?'':'s')+' · '+(ro.horario&&ro.horario.ativo?ro.horario.hora+' ('+diasTxt(ro.horario.dias)+')':'sem horário');}
function prevDe(ro,ts){
  const hr=ro.horario;if(!hr||!hr.ativo||!hr.hora)return null;
  const dt=new Date(ts);if(!hr.dias.includes(dt.getDay()))return null;
  const p=hr.hora.split(':').map(Number);dt.setHours(p[0],p[1],0,0);return dt.getTime();
}
async function abrirReg(tid,ini){
  const d=diaAberto(),t=tarefa(tid);if(!d||!t)return null;
  if(S.regs.some(r=>!r.fim&&r.tarefaId===tid))return null;
  const r=novoReg(d,t,ini||agora());
  S.regs.push(r);await put('regs',r);return r;
}
async function iniciarRotina(rid){
  const d=diaAberto(),ro=S.rotinas.find(x=>x.id===rid);if(!d||!ro)return;
  const its=ro.itens.filter(i=>i.ativo&&tarefa(i.tarefaId));
  if(!its.length){toast('Esta rotina não tem tarefas marcadas');return;}
  const now=agora(),seq=its.filter(i=>i.modo==='seq').map(i=>i.tarefaId);
  for(const i of its.filter(i=>i.modo!=='seq'))await abrirReg(i.tarefaId,now);
  let prox=0;if(seq.length){await abrirReg(seq[0],now);prox=1;}
  const prev=prevDe(ro,now),log={id:prev?'L_'+ro.id+'_'+dataKey(now):'L_'+uid(),rotinaId:ro.id,nome:ro.nome,diaId:d.id,previsto:prev,iniciouEm:now,atrasoMs:prev?Math.max(0,now-prev):0,seq,prox,pulou:false};
  S.rotlog=S.rotlog.filter(x=>x.id!==log.id);S.rotlog.push(log);await put('rotlog',log);
  fechar();render();
  toast('Rotina “'+ro.nome+'” iniciada'+(log.atrasoMs>=MIN?' · atraso de '+fmtDur(log.atrasoMs):''));
}
function rotinasAtrasadas(){
  const d=diaAberto();if(!d)return [];const now=agora(),out=[];
  S.rotinas.forEach(ro=>{
    const prev=prevDe(ro,now);if(!prev||now<prev||prev<d.inicio-2*3600000)return;
    if(S.rotlog.some(l=>l.id==='L_'+ro.id+'_'+dataKey(now)))return;
    if(snooze['rot_'+ro.id]&&now<snooze['rot_'+ro.id])return;
    if(!ro.itens.some(i=>i.ativo&&tarefa(i.tarefaId)))return;
    out.push({ro,prev,atraso:now-prev});
  });
  return out;
}
function rotAlertasHTML(){
  return rotinasAtrasadas().map(x=>`<div class="alerta"><b>⏰ Rotina ${esc(x.ro.nome)}</b> estava marcada para ${fmtHM(x.prev)} ${x.atraso<MIN?'— é agora.':'e está atrasada há '+fmtDur(x.atraso)+'.'}<div class="acts"><button class="btn small navy" onclick="iniciarRotina('${x.ro.id}')">Iniciar agora</button><button class="btn small" onclick="adiarRotina('${x.ro.id}')">Adiar 10 min</button><button class="btn small" onclick="pularRotinaHoje('${x.ro.id}')">Hoje não</button></div></div>`).join('');
}
function adiarRotina(id){snooze['rot_'+id]=agora()+10*MIN;renderBanner();}
async function pularRotinaHoje(id){

  const now=agora(),log={id:'L_'+ro.id+'_'+dataKey(now),rotinaId:ro.id,nome:ro.nome,diaId:d.id,previsto:prevDe(ro,now),iniciouEm:null,atrasoMs:0,seq:[],prox:0,pulou:true};

function previaRotina(id){
  const ro=S.rotinas.find(x=>x.id===id);if(!ro)return;
  const its=ro.itens.filter(i=>i.ativo&&tarefa(i.tarefaId)),jt=its.filter(i=>i.modo!=='seq'),sq=its.filter(i=>i.modo==='seq');

/* sequência: depois de encerrar uma tarefa da fila, oferece a próxima */
function aposEncerrar(r){
  const d=diaAberto();if(!d)return;
  const l=S.rotlog.find(x=>x.diaId===d.id&&x.seq&&x.prox>0&&x.prox<x.seq.length&&x.seq[x.prox-1]===r.tarefaId);
  if(l)promptProx(l,r.nome,r.fim);
}
function promptProx(l,anterior,fim){
  while(l.prox<l.seq.length&&!tarefa(l.seq[l.prox]))l.prox++;
  if(l.prox>=l.seq.length)return;
  const t=tarefa(l.seq[l.prox]);
  modal(`<h3>Rotina “${esc(l.nome)}”</h3><p class="mut">${anterior?'Você encerrou <b>'+esc(anterior)+'</b>. ':''}Próxima da sequência (${l.prox+1} de ${l.seq.length}):</p><div class="ask">${esc(t.nome)}</div>
   <button class="btn gold block" onclick="rotProx('${l.id}','agora')">Iniciar agora</button>
   ${fim&&agora()-fim>=MIN?`<button class="btn block" onclick="rotProx('${l.id}','fim')">Começou quando a anterior terminou (${fmtHM(fim)})</button>`:''}
   <button class="btn block" onclick="rotProx('${l.id}','pular')">Pular esta tarefa</button><button class="link" onclick="fechar()">Depois</button>`);
}
async function rotProx(lid,acao){
  const l=S.rotlog.find(x=>x.id===lid);if(!l)return;
  while(l.prox<l.seq.length&&!tarefa(l.seq[l.prox]))l.prox++;
  if(l.prox>=l.seq.length){fechar();render();return;}
  const tid=l.seq[l.prox];
  if(acao!=='pular'){
    let ini=agora();
    if(acao==='fim'){const pr=S.regs.filter(x=>x.diaId===l.diaId&&x.tarefaId===l.seq[l.prox-1]&&x.fim).sort((a,b)=>b.fim-a.fim)[0];if(pr)ini=pr.fim;}
    await abrirReg(tid,ini);
  }
  l.prox++;await put('rotlog',l);fechar();render();
  if(acao==='pular'&&l.prox<l.seq.length)promptProx(l,null,null);
}
function rotRelHTML(ds){
  const ids=new Set(ds.map(d=>d.id)),ls=S.rotlog.filter(l=>ids.has(l.diaId)&&l.previsto);
  if(!ls.length)return '';

}

async function salvarRotina(){
  edSync();const nome=ed.nome.trim();
  if(!nome){erro('Dê um nome à rotina.');return;}
  if(!ed.itens.some(i=>i.ativo)){erro('Marque ao menos uma tarefa.');return;}
  if(ed.hor.ativo&&(!ed.hor.hora||!ed.hor.dias.length)){erro('Informe a hora e ao menos um dia da semana.');return;}
  const ro={id:ed.id||uid(),nome,itens:ed.itens.map(i=>({tarefaId:i.tarefaId,ativo:!!i.ativo,modo:i.modo==='seq'?'seq':'junto'})),horario:{ativo:!!ed.hor.ativo,hora:ed.hor.hora||'06:30',dias:ed.hor.dias.slice().sort()}};
  const k=S.rotinas.findIndex(x=>x.id===ro.id);if(k>=0)S.rotinas[k]=ro;else S.rotinas.push(ro);

async function criarEIniciar(cid){

async function iniciar(tid){

  if(S.regs.some(r=>!r.fim&&r.tarefaId===tid)){erro('Essa tarefa já está em andamento.');return;}

/* ---------- Encerrar tarefa ---------- */
let cbEnc=null;
function abrirEncerrar(id,done){

  modal(`<h3>Encerrar “${esc(r.nome)}”</h3><p class="mut">${r.retomaDe?'Retomada':'Começou'} às ${fmtHM(r.inicio)} · ${r.retomaDe?'acumulado '+fmtDur(sessaoMs(r)):'há '+fmtDur(agora()-r.inicio)}</p>
   <div class="ask">Você encerrou agora ou esqueceu de encerrar?</div>
   <button class="btn gold block" onclick="encerrarAgora('${id}')">Encerrei agora</button>
   <button class="btn block" onclick="mostrarEsqueci()">Esqueci de encerrar</button>

    <div class="chips"><button class="chip" onclick="preencher(10)">há 10 min</button><button class="chip" onclick="preencher(30)">há 30 min</button><button class="chip" onclick="preencher(60)">há 1h</button><button class="chip" onclick="preencher(120)">há 2h</button></div>
    <div class="erro" id="err"></div><button class="btn navy block" onclick="confirmarEsqueci('${id}')">Confirmar horário</button></div>
   <button class="link" onclick="fechar()">Cancelar</button>`);

function mostrarEsqueci(){$('#esq').hidden=false;preencher(0);}
function preencher(min){const d=new Date(agora()-min*MIN);$('#hr').value=pad(d.getHours())+':'+pad(d.getMinutes());}
async function finalizar(r,fim,esq){
  const now=agora();r.fim=fim;r.marcadoEm=now;const atraso=Math.max(0,now-fim);
  r.esqueceu=!!esq&&atraso>=MIN;r.atrasoMs=r.esqueceu?atraso:0;await put('regs',r);
  fechar();if(r.esqueceu)toast('Anotado: esqueceu por '+fmtDur(r.atrasoMs));
  delete snooze[r.id];
  if(cbEnc){const f=cbEnc;cbEnc=null;f();}else{render();aposEncerrar(r);}
}
function encerrarAgora(id){const r=reg(id);if(r)finalizar(r,agora(),false);}
function confirmarEsqueci(id){
  const r=reg(id),v=$('#hr').value;if(!r||!v){erro('Informe o horário.');return;}
  const [h,m]=v.split(':').map(Number),now=agora(),d=new Date(now);d.setHours(h,m,0,0);
  let ts=d.getTime();if(ts>now)ts-=DIA;
  if(ts<r.inicio){erro('Esse horário é anterior ao início ('+fmtHM(r.inicio)+').');return;}
  finalizar(r,ts,true);
}

/* ---------- Dormir ---------- */
let dormirSug=null;
function abrirDormir(sug){
  if(sug!==undefined)dormirSug=(typeof sug==='number')?sug:null;
  const d=diaAberto();if(!d)return;
  const regs=S.regs.filter(r=>r.diaId===d.id),ab=regs.filter(r=>!r.fim),now=agora(),pzn=pausadasDia(d).length;
  modal(`<h3>Boa noite 🌙</h3>`
   +(ab.length?`<p class="mut" style="margin:6px 0">Antes de dormir, resolva as tarefas ainda abertas:</p>`+ab.map(r=>`<div class="item"><div style="flex:1"><b>${esc(r.nome)}</b><div class="mut small">desde ${fmtHM(r.inicio)} · ${fmtDur(sessaoMs(r,now))}</div></div><button class="btn small gold" onclick="abrirEncerrar('${r.id}',abrirDormir)">Encerrar</button></div>`).join(''):`<p class="ok" style="margin:6px 0">Todas as tarefas estão encerradas.</p>`)
   +(pzn?`<p class="mut small" style="margin:8px 0">${pzn} tarefa${pzn===1?'':'s'} pausada${pzn===1?'':'s'}: ao dormir, ${pzn===1?'fica concluída':'ficam concluídas'} com o tempo acumulado.</p>`:'')
   +`<label>Fui dormir às</label><input type="datetime-local" id="dormi" value="${toLocal(dormirSug&&dormirSug<=now?dormirSug:now)}"><div class="erro" id="err"></div>
   <button class="btn gold block" ${ab.length?'disabled':''} onclick="confirmarDormir()">Encerrar o dia</button><button class="link" onclick="fechar()">Cancelar</button>`);
}
async function confirmarDormir(){
  const d=diaAberto();if(!d)return;
  let ts=new Date($('#dormi').value).getTime();
  const maxFim=Math.max(d.inicio,...S.regs.filter(r=>r.diaId===d.id&&r.fim).map(r=>r.fim));
  if(!ts||isNaN(ts)){erro('Informe o horário.');return;}
  if(ts<maxFim&&maxFim-ts<MIN)ts=maxFim; /* o campo corta os segundos */
  if(ts<maxFim){erro('O horário é anterior ao término da última tarefa ('+fmtHM(maxFim)+').');return;}
  if(ts>agora()+MIN){erro('O horário está no futuro.');return;}
  dormirSug=null;d.fim=ts;await put('dias',d);
  for(const r of pausadasDia(d)){r.pausada=false;await put('regs',r);}
  modal(`<h3>Dia encerrado ✔</h3><p class="mut small" style="margin-bottom:10px">${fmtData(d.inicio)} · ${fmtHM(d.inicio)} → ${fmtHM(d.fim)}</p>${resumoHTML(d)}<button class="btn gold block" onclick="fechar()">Fechar</button>`);
  render();
}

async function salvarReg(id){
  const r=reg(id);if(!r)return;
  const ini=new Date($('#e_i').value).getTime(),fv=$('#e_f').value,fim=fv?new Date(fv).getTime():null;
  if(!ini||isNaN(ini)){erro('Informe o início.');return;}
  if(fim!==null&&(isNaN(fim)||fim<=ini)){erro('O fim precisa ser depois do início.');return;}
  if(fim!==null&&fim>agora()+MIN){erro('O fim está no futuro.');return;}
  const tid=$('#e_t').value;
  if(tid&&tid!==r.tarefaId){const t=tarefa(tid);r.tarefaId=tid;r.nome=t.nome;r.catId=t.catId;delete r.sessaoId;delete r.retomaDe;}
  r.inicio=ini;
  if(fim===null){r.fim=null;r.esqueceu=false;r.marcadoEm=null;r.atrasoMs=0;r.pausada=false;}
  else{
    if(!r.marcadoEm)r.marcadoEm=agora();
    r.fim=fim;
    if($('#e_e').checked&&r.marcadoEm-fim>=MIN){r.esqueceu=true;r.atrasoMs=r.marcadoEm-fim;}else{r.esqueceu=false;r.atrasoMs=0;}
  }
  await put('regs',r);fechar();render();
}
async function excluirReg(id){
  if(!confirm('Excluir este registro?'))return;
  S.regs=S.regs.filter(r=>r.id!==id);await del('regs',id);fechar();render();
}
function abrirEditarDia(id){
  const d=S.dias.find(x=>x.id===id);if(!d)return;
  modal(`<h3>Corrigir dia</h3><label>Acordei às</label><input type="datetime-local" id="d_i" value="${toLocal(d.inicio)}">
   <label>Fui dormir às ${d.fim?'':'(dia em aberto)'}</label><input type="datetime-local" id="d_f" value="${d.fim?toLocal(d.fim):''}" ${d.fim?'':'disabled'}>
   <div class="erro" id="err"></div><button class="btn gold block" onclick="salvarDia('${id}')">Salvar</button>
   <button class="btn danger block" onclick="excluirDia('${id}')">Excluir dia inteiro</button><button class="link" onclick="fechar()">Cancelar</button>`);
}
async function salvarDia(id){
  const d=S.dias.find(x=>x.id===id);if(!d)return;
  const ini=new Date($('#d_i').value).getTime(),fv=$('#d_f').value,fim=d.fim?new Date(fv).getTime():null;
  if(!ini||isNaN(ini)){erro('Informe o horário em que acordou.');return;}
  if(d.fim&&(!fim||isNaN(fim)||fim<=ini)){erro('O horário de dormir precisa ser depois do de acordar.');return;}
  d.inicio=ini;if(d.fim)d.fim=fim;await put('dias',d);fechar();render();
}
async function excluirDia(id){
  if(!confirm('Excluir este dia e todas as suas tarefas?'))return;
  const rs=S.regs.filter(r=>r.diaId===id);
  for(const r of rs)await del('regs',r.id);
  S.regs=S.regs.filter(r=>r.diaId!==id);S.dias=S.dias.filter(d=>d.id!==id);await del('dias',id);
  ui.hist=null;fechar();render();
}

/* ---------- Tela: Histórico ---------- */
function renderHist(){
  if(ui.hist)return renderDia(ui.hist);
  const ds=S.dias.slice().sort((a,b)=>b.inicio-a.inicio);
  $('#view').innerHTML=ds.length?ds.map(d=>{const st=statsDia(d);
    return `<div class="card tap" onclick="verDia('${d.id}')"><div class="row"><b>${fmtData(d.inicio)}</b><span class="mut">${fmtHM(d.inicio)} → ${d.fim?fmtHM(d.fim):'em aberto'}</span></div><div class="mut small">Acordado ${fmtDur(st.acordado)} · ${st.regs.length} tarefa${st.regs.length===1?'':'s'} · ${st.erros.length} distraç${st.erros.length===1?'ão':'ões'}</div></div>`;}).join('')
   :`<div class="empty">Seus dias aparecerão aqui depois do primeiro “Acordei”.</div>`;
}
function renderDia(id){
  const d=S.dias.find(x=>x.id===id);if(!d){ui.hist=null;return renderHist();}
  const now=agora(),st=statsDia(d,now),fim=d.fim==null?now:d.fim,span=Math.max(fim-d.inicio,MIN);
  const regs=st.regs.slice().sort((a,b)=>a.inicio-b.inicio),lanes=[];
  const segs=regs.map(r=>{const x=clip(r,d,now);let l=lanes.findIndex(e=>e<=x[0]);if(l<0){l=lanes.length;lanes.push(0);}lanes[l]=x[1];
    const c=catDe(r),left=(x[0]-d.inicio)/span*100,w=Math.max(.8,(x[1]-x[0])/span*100);
    return `<div class="seg${r.fim?'':' aberta'}" style="left:${left}%;width:${w}%;top:${4+l*26}px;background:${esc(c.cor)}" title="${esc(r.nome)} ${fmtHM(r.inicio)}–${r.fim?fmtHM(r.fim):'agora'}" onclick="abrirEditarReg('${r.id}')">${esc(r.nome)}</div>`;}).join('');
  const horas=Math.max(1,Math.round(span/3600000)),passo=Math.max(1,Math.ceil(horas/7));let ticks='';
  const h0=new Date(d.inicio);h0.setMinutes(0,0,0);
  for(let t=h0.getTime()+3600000;t<fim;t+=3600000){const k=Math.round((t-h0.getTime())/3600000);if(k%passo)continue;const p=(t-d.inicio)/span*100;if(p>3&&p<97)ticks+=`<span style="left:${p}%">${pad(new Date(t).getHours())}h</span>`;}
  let h=`<button class="btn small" onclick="ui.hist=null;render()">← Voltar</button>
   <div class="card" style="margin-top:12px"><div class="row"><div><b style="font-size:18px">${fmtData(d.inicio)}</b><div class="mut small">${fmtHM(d.inicio)} → ${d.fim?fmtHM(d.fim):'em aberto'}</div></div><button class="btn small" onclick="abrirEditarDia('${d.id}')">Corrigir dia</button></div></div>
   <div class="card">${resumoHTML(d)}</div>
   <div class="card"><h3>Linha do tempo</h3><div class="tl" style="height:${lanes.length*26+8}px">${segs}</div><div class="axis">${ticks}</div></div>
   <div class="sec">Tarefas do dia</div><div class="card" style="padding:4px 14px">`;
  h+=regs.length?regs.map(r=>{const c=catDe(r);
    return `<div class="item" style="cursor:pointer" onclick="abrirEditarReg('${r.id}')"><div style="flex:1"><span class="dot" style="background:${esc(c.cor)}"></span><b>${esc(r.nome)}</b><div class="mut small">${fmtHM(r.inicio)}–${r.fim?fmtHM(r.fim):'agora'} · ${fmtDur((r.fim||now)-r.inicio)}</div></div>${r.esqueceu?`<span class="badge">esqueceu · ${fmtDur(r.atrasoMs)}</span>`:''}${pausaBadge(r)}</div>`;}).join(''):`<div class="empty">Sem tarefas neste dia.</div>`;
  $('#view').innerHTML=h+'</div>';
}

/* ---------- Tela: Relatórios ---------- */
/* semana (segunda a domingo) e mês do calendário, com navegação para trás (v3.3) */
function rangePer(per,off){
  const t=new Date(agora());t.setHours(0,0,0,0);
  if(per==='sem'){
    const ini=new Date(t);ini.setDate(ini.getDate()-((t.getDay()+6)%7)-7*off);
    const fim=new Date(ini);fim.setDate(fim.getDate()+7);
    return {ini:ini.getTime(),fim:fim.getTime()};
  }
  const ini=new Date(t.getFullYear(),t.getMonth()-off,1),fim=new Date(t.getFullYear(),t.getMonth()-off+1,1);
  return {ini:ini.getTime(),fim:fim.getTime()};
}
function tituloPer(r){
  if(ui.per==='mes'){const x=new Date(r.ini).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return x.charAt(0).toUpperCase()+x.slice(1);}
  const a=new Date(r.ini),b=new Date(r.fim-DIA/2),f=d=>d.toLocaleDateString('pt-BR',{day:'numeric',month:'short'}).replace('.','');
  return f(a)+' a '+f(b);
}
function navPerHTML(){
  if(ui.per!=='sem'&&ui.per!=='mes')return '';
  const r=rangePer(ui.per,ui.off);
  return `<div class="row" style="margin-top:10px"><button class="btn small" onclick="ui.off++;render()" aria-label="Anterior">◀</button><b style="color:var(--navy)">${esc(tituloPer(r))}${ui.off===0?` <span class="mut small">(atual)</span>`:''}</b><button class="btn small" ${ui.off===0?'disabled':''} onclick="ui.off--;render()" aria-label="Próximo">▶</button></div>`;
}
function hhmm(min){min=((Math.round(min)%1440)+1440)%1440;return pad(Math.floor(min/60))+':'+pad(min%60);}
function diaADiaHTML(ds,now){
  const r=rangePer(ui.per,ui.off),mes=ui.per==='mes',dias=[];
  for(let t=new Date(r.ini);t.getTime()<r.fim;t.setDate(t.getDate()+1)){const a=t.getTime(),b=new Date(a);b.setDate(b.getDate()+1);
    const dd=ds.filter(d=>d.inicio>=a&&d.inicio<b.getTime());
    dias.push({dt:new Date(a),ac:dd.reduce((x,d)=>x+statsDia(d,now).acordado,0),fut:a>now});}
  const mx=Math.max(1,...dias.map(x=>x.ac)),sem=['D','S','T','Q','Q','S','S'];
  return `<div class="card"><h3>Dia a dia</h3><div class="mut small">Tempo acordado por dia</div><div class="trend">`+dias.map(x=>{
    const n=x.dt.getDate(),lab=mes?((n===1||n%5===0)?n:''):sem[x.dt.getDay()]+' '+n;
    return `<div title="${esc(x.dt.toLocaleDateString('pt-BR'))}: ${x.ac?fmtDur(x.ac):'sem registro'}"><span>${!mes&&x.ac?Math.round(x.ac/3600000)+'h':''}</span><i style="height:${x.ac/mx*72}%;background:${x.ac?'var(--navy)':'transparent'}"></i><span style="${mes?'font-size:9px':''}">${lab}</span></div>`;}).join('')+`</div></div>`;
}
function horariosHTML(ds){
  const f=ds.filter(d=>d.fim!=null);if(!f.length)return '';
  const mid=ts=>{const t=new Date(ts);t.setHours(0,0,0,0);return t.getTime();};
  const ac=f.map(d=>(d.inicio-mid(d.inicio))/MIN),dm=f.map(d=>(d.fim-mid(d.inicio))/MIN);
  const med=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const cedo=Math.min(...ac),tarde=Math.max(...dm);
  return `<div class="card"><h3>Horários</h3><div class="grid"><div class="kpi"><span>${hhmm(med(ac))}</span>acorda em média</div><div class="kpi"><span>${hhmm(med(dm))}</span>dorme em média</div><div class="kpi"><span>${fmtDur(med(f.map(d=>d.fim-d.inicio)))}</span>dia acordado</div><div class="kpi"><span>${f.length}</span>dia${f.length===1?'':'s'} fechado${f.length===1?'':'s'}</div></div><p class="mut small">Mais cedo: acordou às ${hhmm(cedo)} · Mais tarde: dormiu às ${hhmm(tarde)}</p></div>`;
}
function diasPeriodo(){
  const ds=S.dias.slice().sort((a,b)=>a.inicio-b.inicio),now=agora();
  if(ui.per==='sem'||ui.per==='mes'){const r=rangePer(ui.per,ui.off);return ds.filter(d=>d.inicio>=r.ini&&d.inicio<r.fim);}
  if(ui.per==='dia')return ds.slice(-1);
  if(ui.per==='tudo')return ds;
  return ds.filter(d=>d.inicio>=now-Number(ui.per)*DIA);
}
function renderRel(){
  const ds=diasPeriodo(),now=agora();
  const chips=[['dia','Último dia'],['7','7 dias'],['30','30 dias'],['sem','Semana'],['mes','Mês'],['tudo','Tudo']].map(p=>`<button class="chip${ui.per===p[0]?' on':''}" onclick="ui.per='${p[0]}';ui.off=0;render()">${p[1]}</button>`).join('');
  let h=`<div class="chips">${chips}</div>`+navPerHTML();
  if(!ds.length){$('#view').innerHTML=h+`<div class="empty">Sem dados neste período.</div>`;return;}
  let ac=0,so=0,sem=0,par=0;const regs=[],porCat={};
  ds.forEach(d=>{const st=statsDia(d,now);ac+=st.acordado;so+=st.soma;sem+=st.sem;par+=st.par;st.regs.forEach(r=>regs.push(r));
    catTotais(st.regs,d,now).forEach(c=>{(porCat[c.nome+c.cor]=porCat[c.nome+c.cor]||{nome:c.nome,cor:c.cor,ms:0}).ms+=c.ms;});});
  h+=`<div class="card" style="margin-top:10px"><h3>Visão geral · ${ds.length} dia${ds.length===1?'':'s'}</h3><div class="grid"><div class="kpi"><span>${fmtDur(ac)}</span>acordado</div><div class="kpi"><span>${fmtDur(so)}</span>em tarefas</div><div class="kpi"><span>${fmtDur(sem)}</span>sem registro</div><div class="kpi"><span>${fmtDur(par)}</span>em paralelo</div></div>
   <p class="mut small">“Em tarefas” soma cada tarefa; “sem registro” é o tempo acordado sem nenhuma tarefa aberta; “em paralelo” é a sobreposição.</p></div>
   <div class="card"><h3>Por categoria</h3>${barras(Object.values(porCat).sort((a,b)=>b.ms-a.ms))}</div>`;
  h+=compRelHTML(ds,now);
  if(ui.per==='sem'||ui.per==='mes')h+=diaADiaHTML(ds,now)+horariosHTML(ds);
  h+=metasRelHTML(ds,now);
  h+=repRelHTML(ds,now);
  h+=rotRelHTML(ds);
  const porTar={};
  regs.forEach(r=>{const x=(porTar[r.tarefaId||r.nome]=porTar[r.tarefaId||r.nome]||{nome:r.nome,ms:0,n:0});x.ms+=Math.max(0,(r.fim||now)-r.inicio);x.n+=r.retomaDe?0:1;});
  const top=Object.values(porTar).sort((a,b)=>b.ms-a.ms).slice(0,8);
  h+=`<div class="card"><h3>Tarefas que mais tomam tempo</h3>`+top.map(x=>`<div class="item"><div style="flex:1"><b>${esc(x.nome)}</b><div class="mut small">${x.n} vez${x.n===1?'':'es'}</div></div><b>${fmtDur(x.ms)}</b></div>`).join('')+`</div>`;
  /* Disciplina */
  const fech=regs.filter(r=>r.fim&&!r.pausada&&!r.inst),erros=fech.filter(r=>r.esqueceu).sort((a,b)=>b.fim-a.fim);
  const atTot=erros.reduce((a,r)=>a+r.atrasoMs,0),acerto=fech.length?Math.round((fech.length-erros.length)/fech.length*100):100;
  const maior=erros.reduce((a,r)=>Math.max(a,r.atrasoMs),0);
  h+=`<div class="sec">Disciplina</div><div class="card"><div class="grid"><div class="kpi"><span>${acerto}%</span>encerradas na hora</div><div class="kpi"><span>${erros.length}</span>distrações</div><div class="kpi"><span>${erros.length?fmtDur(atTot/erros.length):'—'}</span>atraso médio</div><div class="kpi"><span>${erros.length?fmtDur(maior):'—'}</span>maior atraso</div></div>`;
  if(ds.length>1){
    const last=ds.slice(-14),cont=last.map(d=>S.regs.filter(r=>r.diaId===d.id&&r.esqueceu).length),mx=Math.max(1,...cont);
    h+=`<div class="mut small">Distrações por dia</div><div class="trend">`+last.map((d,i)=>`<div><span>${cont[i]||''}</span><i style="height:${cont[i]/mx*72}%"></i><span>${last.length>7?pad(new Date(d.inicio).getDate()):pad(new Date(d.inicio).getDate())+'/'+pad(new Date(d.inicio).getMonth()+1)}</span></div>`).join('')+`</div>`;
  }
  const rank={};erros.forEach(r=>{const x=(rank[r.nome]=rank[r.nome]||{n:0,ms:0});x.n++;x.ms+=r.atrasoMs;});
  const rk=Object.entries(rank).sort((a,b)=>b[1].n-a[1].n).slice(0,5);
  if(rk.length)h+=`<div class="mut small" style="margin-top:14px">Tarefas mais esquecidas</div>`+rk.map(([n,x])=>`<div class="item"><div style="flex:1"><b>${esc(n)}</b></div><span class="mut">${x.n}× · ${fmtDur(x.ms)} de atraso</span></div>`).join('');
  h+=`</div>`;
  h+=`<div class="card"><h3>Do feito ao registro</h3><p class="mut small" style="margin-bottom:6px">Para cada esquecimento: quando terminou de verdade, quando foi registrado e quanto tempo passou.</p>`
   +(erros.length?erros.slice(0,30).map(r=>`<div class="item"><div style="flex:1"><b>${esc(r.nome)}</b><div class="mut small">${fmtDataHora(r.fim)} → registrado ${fmtDataHora(r.marcadoEm)}</div></div><span class="badge">${fmtDur(r.atrasoMs)}</span></div>`).join(''):`<div class="empty">Nenhuma distração no período. 👏</div>`)+`</div>`;
  $('#view').innerHTML=h;
}

async function setCfg(k,v){S.cfg[k]=v;await put('cfg',{key:k,value:v});}
async function ativarNotif(el){
  if(!el.checked){await setCfg('notif',false);return;}
  const p=await Notification.requestPermission();
  if(p==='granted'){await setCfg('notif',true);toast('Notificações ativadas');}else{el.checked=false;await setCfg('notif',false);toast('Permissão negada pelo navegador');}
}
async function addCat(){const n=$('#nc_nome').value.trim();if(!n)return;const c={id:uid(),nome:n,cor:$('#nc_cor').value};S.cats.push(c);await put('cats',c);render();}
async function editCat(id,k,v){const c=S.cats.find(x=>x.id===id);if(!c)return;if(k==='nome'&&!v.trim())return render();c[k]=v.trim?v.trim():v;await put('cats',c);render();}
async function delCat(id){
  if(!confirm('Excluir a categoria? As tarefas dela vão para “Outros”.'))return;
  for(const t of S.tarefas.filter(t=>t.catId===id)){t.catId='c_outros';await put('tarefas',t);}
  for(const r of S.regs.filter(r=>r.catId===id)){r.catId='c_outros';await put('regs',r);}
  S.cats=S.cats.filter(c=>c.id!==id);await del('cats',id);render();
}

async function catTar(id,v){const t=tarefa(id);if(!t)return;if(v==='__nova'){render();abrirNovaCat({tipo:'tarefa',id});return;}t.catId=v;await put('tarefas',t);for(const r of S.regs.filter(r=>r.tarefaId===id)){r.catId=v;await put('regs',r);}render();}

/* ---------- Backup ---------- */
function baixar(nome,conteudo,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
const hoje=()=>new Date().toISOString().slice(0,10);
function exportarJSON(){baixar(`Fenix_Gestor_de_Tempo_backup_${hoje()}.json`,JSON.stringify({app:'fenix-tempo',versao:VERSAO,dias:S.dias,cats:S.cats,tarefas:S.tarefas,regs:S.regs,rotinas:S.rotinas,rotlog:S.rotlog,cfg:S.cfg},null,1),'application/json');}
function exportarCSV(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',dt=t=>t?new Date(t).toLocaleString('pt-BR'):'';
  const ln=['Dia;Tarefa;Categoria;Início;Fim;Duração (min);Esqueceu;Atraso (min)'];
  S.regs.slice().sort((a,b)=>a.inicio-b.inicio).forEach(r=>{const d=S.dias.find(x=>x.id===r.diaId);
    ln.push([q(d?fmtData(d.inicio):''),q(r.nome),q(catDe(r).nome),q(dt(r.inicio)),q(dt(r.fim)),r.fim?Math.round((r.fim-r.inicio)/MIN):'',r.esqueceu?'sim':'não',r.esqueceu?Math.round(r.atrasoMs/MIN):0].join(';'));});
  baixar(`Fenix_Gestor_de_Tempo_registros_${hoje()}.csv`,'\ufeff'+ln.join('\r\n'),'text/csv;charset=utf-8');
}
async function importarJSON(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text()),ok=/^[\w-]+$/;
    if(j.app!=='fenix-tempo'||!Array.isArray(j.dias)||!Array.isArray(j.regs)||!Array.isArray(j.cats)||!Array.isArray(j.tarefas))throw 0;
    if((j.rotinas&&!Array.isArray(j.rotinas))||(j.rotlog&&!Array.isArray(j.rotlog)))throw 0;
    if([...j.dias,...j.regs,...j.cats,...j.tarefas,...(j.rotinas||[]),...(j.rotlog||[])].some(o=>!o||!ok.test(o.id)))throw 0;
    if(!confirm('Importar vai SUBSTITUIR todos os dados atuais.'+(Sync.mod?'\n\nA sincronização está ativa: isso também substitui os dados na nuvem e nos seus outros aparelhos. Antes, o app guarda um backup na nuvem do estado atual.':'')+'\n\nContinuar?'))return;
    await bkpSeguranca('antes de importar');
    await restaurarDados(j);toast('Backup importado');
  }catch(e){toast('Arquivo inválido');}
}
function validarBackup(j){
  const ok=/^[\w-]+$/;
  if(!j||j.app!=='fenix-tempo'||!Array.isArray(j.dias)||!Array.isArray(j.regs)||!Array.isArray(j.cats)||!Array.isArray(j.tarefas))return false;
  if((j.rotinas&&!Array.isArray(j.rotinas))||(j.rotlog&&!Array.isArray(j.rotlog)))return false;
  return ![...j.dias,...j.regs,...j.cats,...j.tarefas,...(j.rotinas||[]),...(j.rotlog||[])].some(o=>!o||!ok.test(o.id));
}
async function restaurarDados(j){
  const SS=['dias','cats','tarefas','regs','rotinas','rotlog'];
  for(const st of SS)await clear(st);
  for(const st of SS)for(const o of (j[st]||[]))await put(st,o);
  S.dias=j.dias;S.cats=j.cats;S.tarefas=j.tarefas;S.regs=j.regs;S.rotinas=j.rotinas||[];S.rotlog=j.rotlog||[];
  if(!S.cats.some(c=>c.id==='c_outros')){S.cats.push({...OUTROS});await put('cats',{...OUTROS});}
  if(j.cfg&&typeof j.cfg==='object'){for(const k of ['limiteMin','repetirMin','lembretes','notif'])if(k in j.cfg){S.cfg[k]=j.cfg[k];await put('cfg',{key:k,value:j.cfg[k]});}}
  ui.hist=null;render();
}
async function apagarTudo(){
  if(!confirm(Sync.mod?'Apagar TODOS os dados? A sincronização está ativa: isso apaga também na nuvem e em TODOS os seus aparelhos. Não pode ser desfeito.':'Apagar TODOS os dados do app neste aparelho? Isso não pode ser desfeito.'))return;
  if(!confirm('Tem certeza? Faça um backup antes se precisar.'))return;
  await bkpSeguranca('antes de apagar tudo');
  for(const st of ['dias','cats','tarefas','regs','rotinas','rotlog','cfg'])await clear(st);
  S.dias=[];S.cats=[];S.tarefas=[];S.regs=[];S.rotinas=[];S.rotlog=[];await semear();ui.hist=null;render();toast('Dados apagados');
}

/* ---------- Lembretes ---------- */
function vencidas(){const now=agora();return S.regs.filter(r=>!r.fim&&sessaoMs(r,now)>limite(r)&&(!snooze[r.id]||now>=snooze[r.id]));}
/* dia aberto há muito tempo: provavelmente esqueceu de dormir (v3.2) */
const DIA_LONGO=20*3600000;
function diaLongo(){
  const d=diaAberto();if(!d)return null;const now=agora();
  if(now-d.inicio<DIA_LONGO)return null;
  if(snooze['dia_'+d.id]&&now<snooze['dia_'+d.id])return null;
  return d;
}
function sugestaoDormir(d){
  const rs=S.regs.filter(r=>r.diaId===d.id);
  return Math.max(d.inicio,...rs.map(r=>r.fim||r.inicio));
}
function diaLongoHTML(){
  const d=diaLongo();if(!d)return '';
  return `<div class="alerta"><b>🌙 Seu dia está aberto há ${fmtDur(agora()-d.inicio)}.</b> Você já foi dormir? Se esqueceu de marcar, corrija o horário.<div class="acts"><button class="btn small navy" onclick="abrirDormir(${sugestaoDormir(d)})">Já dormi</button><button class="btn small" onclick="adiarDia('${d.id}')">Ainda estou acordado</button></div></div>`;
}
function adiarDia(id){snooze['dia_'+id]=agora()+2*3600000;renderBanner();}
function renderBanner(){
  const b=$('#banner'),rot=aprAlertaHTML()+diaLongoHTML()+repAlertasHTML()+rotAlertasHTML();if(!S.cfg.lembretes){b.innerHTML=rot;return;}
  const now=agora();
  const est=metasEstouradas(),ids=new Set(est.map(x=>x.r.id));
  b.innerHTML=rot+est.map(x=>`<div class="alerta"><b>🎯 ${esc(x.t.nome)}</b> passou do limite de hoje: ${fmtDur(x.ms)} (meta: até ${fmtDur(x.t.meta.min*MIN)}).<div class="acts"><button class="btn small navy" onclick="abrirEncerrar('${x.r.id}')">Encerrar</button><button class="btn small" onclick="adiarMeta('${x.t.id}')">Ainda estou nisso</button></div></div>`).join('')+vencidas().filter(r=>!ids.has(r.id)).map(r=>{const t=tipico(r.tarefaId);
    return `<div class="alerta"><b>⏰ ${esc(r.nome)}</b> está aberta há ${fmtDur(sessaoMs(r,now))}${t?` (costuma levar ~${fmtDur(t)})`:''}. Já terminou?<div class="acts"><button class="btn small navy" onclick="abrirEncerrar('${r.id}')">Encerrar</button><button class="btn small" onclick="adiar('${r.id}')">Ainda estou nisso</button></div></div>`;}).join('');
}
function adiar(id){snooze[id]=agora()+S.cfg.repetirMin*MIN;renderBanner();}
function notificar(t,corpo,tag){
  try{
    if(swReg&&swReg.showNotification)swReg.showNotification(t,{body:corpo,icon:'icon-192.png',badge:'icon-192.png',tag,renotify:true});
    else new Notification(t,{body:corpo,icon:'icon-192.png',tag});
  }catch(e){}
}
function checar(){
  renderBanner();bkpAuto();
  if(!S.cfg.lembretes)return;
  if(!S.cfg.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  const now=agora();
  const dl=diaLongo();if(dl&&now-(notif['dia_'+dl.id]||0)>=2*3600000){notif['dia_'+dl.id]=now;notificar('Fênix · esqueceu de dormir?','Seu dia está aberto há '+fmtDur(now-dl.inicio)+'. Toque para corrigir.','dia_'+dl.id);}
  const est=metasEstouradas(),ids=new Set(est.map(x=>x.r.id));
  est.forEach(x=>{const k='meta_'+x.t.id;if(now-(notif[k]||0)>=S.cfg.repetirMin*MIN){notif[k]=now;notificar('Fênix · limite de '+x.t.nome,'Já são '+fmtDur(x.ms)+' hoje (meta: até '+fmtDur(x.t.meta.min*MIN)+').',k);}});
  repAtrasadas().forEach(({t,s})=>{const k='rep_'+t.id;if(now-(notif[k]||0)>=S.cfg.repetirMin*MIN){notif[k]=now;notificar(s.doses?'Fênix · 💊 '+t.nome:'Fênix · 🔁 '+t.nome,s.doses?('Dose '+(s.cont+1)+' de '+s.meta+': '+s.txt.replace(/^\d+\/\d+ hoje · /,'')):('Está '+s.txt+'.'),k);}});
  vencidas().filter(r=>!ids.has(r.id)).forEach(r=>{if(now-(notif[r.id]||0)>=S.cfg.repetirMin*MIN){notif[r.id]=now;notificar('Fênix · '+r.nome,'Aberta há '+fmtDur(sessaoMs(r,now))+'. Já terminou?',r.id);}});
}
let n=0;
function tick(){
  const now=agora();
  document.querySelectorAll('[data-since]').forEach(el=>{el.textContent=fmtClock(now-Number(el.dataset.since));});
}
setInterval(()=>{tick();if(++n%30===0)checar();if(n%15===0)metasAoVivo();if(n%300===0&&!document.hidden)atualizarPend();},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checar();tick();atualizarPend();}});

opo leva direto às Aprovações. A consulta é refeita sozinha a cada 5 minutos e sempre que o app volta para a tela.</li></ul><p style="margin-top:12px"><b>v3.5</b> — repetição das tarefas</p><ul class="cl"><li>Em Ajustes › Tarefas, o botão 🔁 define como a tarefa se repete: <b>quantas vezes</b> (ex.: água 8× por dia, com botão +1 ou com cronômetro), <b>dias da semana</b> (ex.: faxina seg, qui e dom) ou <b>a cada N dias</b> (ex.: faxina a cada 15 dias, contando da última vez).</li><li>Na tela Hoje, o card “Para hoje” mostra o que está previsto, com Iniciar, Já fiz e Pular; o que passou do dia sem fazer vira um aviso no topo.</li><li>Relatórios ganharam o card “Repetições” (dias cumpridos, média por dia ou semana, intervalo médio).</li></ul><p style="margin-top:12px"><b>v3.4</b> — backup na nuvem</p><ul class="cl"><li>Com a conta ativa, o app guarda sozinho uma cópia dos seus dados por dia (as 20 mais recentes) e você restaura qualquer uma em Ajustes › Backup na nuvem.</li><li>Antes de importar um arquivo, apagar tudo ou restaurar, o app guarda uma cópia do estado atual na nuvem.</li><li>Os backups são privados e apagados junto com a conta.</li></ul><p style="margin-top:12px"><b>v3.3</b> — painel semanal e mensal</p><ul class="cl"><li>Em Relatórios, novos períodos “Semana” (segunda a domingo) e “Mês”, com setas ◀ ▶ para ver semanas e meses anteriores.</li><li>Comparação com a semana ou o mês anterior, gráfico “Dia a dia” de tempo acordado e card “Horários” (média de acordar e dormir, dia mais cedo e mais tarde).</li></ul><p style="margin-top:12px"><b>v3.2</b> — esqueci de dormir</p><ul class="cl"><li>Se o dia ficar aberto por mais de 20 horas, o app pergunta se você já dormiu. “Já dormi” abre o encerramento do dia já com o horário da sua última atividade, para você ajustar; “Ainda estou acordado” silencia por 2 horas.</li></ul><p style="margin-top:12px"><b>v3.1</b> — tela Hoje</p><ul class="cl"><li>“Em andamento” (e “Pausadas”) agora vêm antes de “Metas de hoje”: primeiro o que está acontecendo, depois o acompanhamento das metas.</li></ul><p style="margin-top:12px"><b>v3.0</b> — várias pessoas</p><ul class="cl"><li>Qualquer pessoa pode criar a própria conta (☁ › Não tenho conta). O cadastro é liberado pelo administrador; enquanto aguarda, o app funciona normalmente no aparelho.</li><li>Cada pessoa vê só os seus dados, em qualquer aparelho. O administrador aprova e bloqueia cadastros em ☁ › Aprovações.</li><li>Excluir minha conta apaga a conta e os dados da nuvem. Política de privacidade disponível no app.</li></ul><p style="margin-top:12px"><b>v2.1</b> — janelas mais seguras</p><ul class="cl"><li>Toda janela agora tem um ✕ para fechar. Tocar fora dela ou rolar para cima não fecha mais nem atualiza a tela.</li></ul><p style="margin-top:12px"><b>v2.0</b> — vários aparelhos, uma conta</p><ul class="cl"><li>Entre com a conta do Fênix Core (☁ no topo). O que você inicia, pausa ou encerra em um aparelho aparece no outro em tempo real.</li><li>Tarefas iniciadas em outro aparelho mostram “iniciada em Tablet”; dê um nome a cada aparelho na tela da conta.</li><li>Na primeira entrada, os dados que já estão no aparelho sobem para a nuvem sem duplicar (tarefas e categorias com o mesmo nome são unidas).</li><li>Funciona sem internet: o que for feito offline sobe sozinho quando a conexão volta. Em edições simultâneas vale a última alteração.</li><li>Relógios dos aparelhos são alinhados pelo horário do servidor.</li><li>Seus dados são privados da sua conta. Lembretes e avisos de rotina continuam só com o app aberto.</li></ul><p style="margin-top:12px"><b>v1.4</b> — pausa e categorias livres</p><ul class="cl"><li>Pausar e retomar: a tarefa em andamento ganhou o botão ⏸ Pausar. Ela vai para “Pausadas” com o tempo acumulado, e dali você retoma (▶) ou conclui. Retomar de novo soma ao que já foi feito.</li><li>O tempo pausado não conta como tempo da tarefa (nem para metas e relatórios) e aparece como “sem registro”. Lembretes, tempo típico e “quantas vezes” usam a soma da sessão inteira.</li><li>Pausadas ficam no topo da lista de iniciar; tocar em uma retoma. Ao dormir, as pausadas ficam concluídas com o tempo acumulado.</li><li>Categorias novas direto no fluxo: ao criar uma tarefa em Iniciar tarefa há “+ Nova categoria” (nome e cor), e os seletores de categoria em Ajustes ganharam “+ Nova categoria…”.</li></ul><p style="margin-top:12px"><b>v1.3</b> — rotinas</p><ul class="cl"><li>Modelos de rotina (Ajustes › Rotinas): marque quais tarefas fazem parte; cada uma pode começar “junto” com a rotina ou “em sequência”, na ordem da lista. Desmarcar o check tira a tarefa da rotina sem apagar nada.</li><li>Na sequência, ao encerrar uma tarefa o app oferece a próxima: iniciar agora, iniciar a partir do término da anterior, pular ou deixar para depois (fica em “Rotinas em andamento”).</li><li>Rotina com horário e dias da semana: com o app aberto e o dia iniciado, avisa “atrasada há X min” com Iniciar agora, Adiar 10 min e Hoje não.</li><li>Relatórios: atraso médio e quantas vezes cada rotina com horário foi iniciada ou pulada. Backup inclui rotinas.</li><li>Banco de dados atualizado para a versão 2 sem perder nenhum registro.</li></ul><p style="margin-top:12px"><b>v1.2</b> — refinando o dia a dia</p><ul class="cl"><li>Aviso de limite: quando uma meta “no máximo” estoura com a tarefa ainda rodando (ex.: TV), aparece um alerta com Encerrar / “Ainda estou nisso”, e a notificação do sistema, se ativada.</li><li>Tarefas favoritas: toque na ☆ em Ajustes › Tarefas e ela vira um atalho ▶ na tela Hoje, que inicia a tarefa com um toque. Favoritas também ficam no topo da lista de iniciar.</li><li>Relatórios: comparação das médias por dia com o período anterior (7 ou 30 dias), por categoria, incluindo as distrações. O dia em andamento fica de fora por ser parcial.</li></ul><p style="margin-top:12px"><b>v1.1</b> — metas por tarefa e ícone oficial</p><ul class="cl"><li>Metas diárias por tarefa: “pelo menos” (ex.: estudar 2h) ou “no máximo” (ex.: TV até 1h), definidas em Ajustes › Tarefas (botão 🎯).</li><li>Card “Metas de hoje” na tela Hoje, com barra de progresso ao vivo, e metas no resumo do dia (Dormir e Histórico).</li><li>Relatórios: dias em que cada meta foi cumprida, média diária e sequência atual; o dia em andamento não conta como falha antes de terminar.</li><li>Ícone oficial Fênix no app instalado, no cabeçalho e nas notificações.</li><li>Correção: “0 distraçãoões” agora aparece como “0 distrações” (singular e plural); cabeçalho ajustado para telas pequenas.</li></ul><p style="margin-top:12px"><b>v1.0</b> — versão inicial</p>
