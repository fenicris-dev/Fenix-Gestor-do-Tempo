<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FÊNIX | Gestor de Tempo</title>
<meta name="description" content="Gestor de tempo pessoal: cronometra o dia do Acordei ao Dormir e cada tarefa, com disciplina de encerramento.">
<meta name="theme-color" content="#041273">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--navy:#041273;--navy2:#1a2bb0;--gold:#d4a62a;--gold-d:#a67f12;--gold-l:#fbf1cf;--bg:#f3f4fa;--card:#fff;--txt:#161a33;--mut:#6a6f8f;--bd:#e3e5f0;--ok:#188a52;--warn:#c9741a;--err:#c5303a;--r:14px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior-y:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.35}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
header .lg{width:32px;height:32px;border-radius:8px;flex:none}
header .logo{font-weight:800;letter-spacing:.5px;font-size:17px}
header .logo b{color:var(--gold)}
header .ver{font-size:11px;background:rgba(255,255,255,.15);padding:2px 7px;border-radius:99px}
header .sp{flex:1}
header button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer}
.card h3,.sec{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:18px 2px 8px;font-weight:700}
.card h3{margin:0 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--mut)}.small{font-size:13px}.ok{color:var(--ok)}.err{color:var(--err)}
.hero{text-align:center;padding:40px 10px 24px}
.hero .sun{font-size:64px;line-height:1}
.hero h2{margin:8px 0 4px;color:var(--navy);font-size:26px}
.hero p{color:var(--mut);margin-bottom:22px}
button{font:inherit;cursor:pointer}
.big{border:0;border-radius:99px;padding:20px 54px;font-size:22px;font-weight:800;color:#fff;background:var(--navy);box-shadow:0 6px 18px rgba(4,18,115,.3)}
.big.gold{background:linear-gradient(135deg,#e7bb3d,var(--gold));color:#2b2100;box-shadow:0 6px 18px rgba(212,166,42,.4)}
.btn{border:1px solid var(--bd);background:#fff;color:var(--navy);padding:11px 16px;border-radius:12px;font-weight:700}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b2100}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--err);border-color:#f0c9cc}
.btn.small{padding:7px 12px;font-size:14px}
.btn.block{display:block;width:100%;margin-top:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--navy2);padding:10px 4px;text-decoration:underline;display:block;margin:6px auto 0}
.dia{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0}
.dia .clock{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.dia .mut{color:rgba(255,255,255,.75)}
.dia button.edit{background:none;border:0;color:var(--gold);text-decoration:underline;padding:0;font-size:13px}
.chip{display:inline-block;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:5px 11px;font-size:13px;margin:4px 6px 0 0;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips button.chip{cursor:pointer}
.st{display:inline-block;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 10px;font-size:13px;margin:8px 6px 0 0;cursor:pointer}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.run{border-left:5px solid var(--gold)}
.run .timer{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy)}
.badge{font-size:12px;border-radius:99px;padding:2px 8px;background:#fde8ea;color:var(--err);font-weight:700}
.banner{max-width:720px;margin:10px auto 0;padding:0 14px}
.alerta{background:var(--gold-l);border:1px solid #ecd48a;border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.alerta .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--navy);font-weight:800}
nav button.on i{filter:none}
#modal{position:fixed;inset:0;background:rgba(10,14,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal{overscroll-behavior:contain}
.sheet{overscroll-behavior:contain}
.xf{position:sticky;top:0;float:right;margin:-6px -6px 0 8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:#fff;color:var(--navy);font-size:18px;line-height:1;z-index:2;padding:0}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:20px}}
@media(max-width:430px){header{gap:8px}header .logo{font-size:15px;white-space:nowrap}header .ver{display:none}}
.sheet label.sw{display:flex;margin:12px 0 4px}
.sheet h3{color:var(--navy);margin-bottom:6px;font-size:20px}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px;font-weight:600}
input,select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:11px;background:#fff;color:var(--txt)}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;height:40px;width:54px}
.ask{background:var(--gold-l);border-radius:12px;padding:12px;margin:12px 0 4px;font-weight:700;color:#5a4300}
.erro{color:var(--err);font-size:14px;min-height:18px;margin-top:6px}
.lista .it{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.lista .it.off{opacity:.45;cursor:default}
.lista .it:last-child{border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut)}
.kpi span{display:block;font-size:20px;font-weight:800;color:var(--navy)}
.bar{margin:9px 0}
.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:3px}
.bar .tr{height:9px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px}
.tl{position:relative;background:var(--bg);border-radius:10px;margin:6px 0 2px}
.tl .seg{position:absolute;height:22px;border-radius:6px;color:#fff;font-size:11px;line-height:22px;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:clip;cursor:pointer;min-width:4px}
.tl .seg.aberta{outline:2px dashed rgba(0,0,0,.4)}
.axis{position:relative;height:18px;font-size:11px;color:var(--mut)}
.axis span{position:absolute;transform:translateX(-50%)}
.trend{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:6px}
.trend div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.trend i{display:block;width:100%;background:var(--err);border-radius:5px 5px 0 0;min-height:2px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.sw input[type=number]{width:90px}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.item input[type=text]{flex:1}
.item select{width:auto;max-width:140px}
.item.tw{flex-wrap:wrap;padding:10px 0}
.item.tw input[type=text]{flex:1 1 calc(100% - 128px);min-width:0}
.item.tw select{flex:1;max-width:none;min-width:0}
.run .btn{white-space:nowrap}
.run .row>div:first-child{min-width:0}
header button#nuvem{position:relative;padding:6px 10px}
#nvd{position:absolute;right:3px;top:3px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--navy);background:#8a90b8}
#nvd.s-ok{background:#35c47a}#nvd.s-conectando,#nvd.s-offline{background:#f0b13a}#nvd.s-erro{background:#ef5b66}
.dotst{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:#8a90b8}
.dotst.s-ok{background:#35c47a}.dotst.s-conectando,.dotst.s-offline{background:#f0b13a}.dotst.s-erro{background:#ef5b66}
.devtag{display:inline-block;background:#e8ecff;color:var(--navy);border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:80;max-width:90%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
ul.cl{padding-left:18px;margin:6px 0}ul.cl li{margin:3px 0;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
</style>
</head>
<body>
<header>
  <img class="lg" src="icon-192.png" alt="" width="32" height="32">
  <div class="logo">FÊNIX <b>|</b> Gestor de Tempo</div>
  <span class="ver">v2.1</span>
  <div class="sp"></div>
  <button id="nuvem" onclick="abrirConta()" title="Conta e sincronização">☁<i id="nvd" class="s-local"></i></button>
  <button onclick="abrirSobre()">Sobre</button>
</header>
<div class="banner" id="banner"></div>
<main id="view"></main>
<nav id="nav">
  <button data-t="hoje" onclick="go('hoje')"><i>⏱</i>Hoje</button>
  <button data-t="hist" onclick="go('hist')"><i>🗓</i>Histórico</button>
  <button data-t="rel" onclick="go('rel')"><i>📊</i>Relatórios</button>
  <button data-t="ajustes" onclick="go('ajustes')"><i>⚙</i>Ajustes</button>
</nav>
<div id="modal"></div>

<script>
'use strict';
/* ===== FÊNIX | Gestor de Tempo v2.1 ===== */
const VERSAO='2.1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let OFFSET=0;const agora=()=>Date.now()+OFFSET;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MIN=60000,DIA=86400000;

/* ---------- Armazenamento (IndexedDB) ---------- */
let db=null;
const S={dias:[],cats:[],tarefas:[],regs:[],rotinas:[],rotlog:[],cfg:{limiteMin:60,repetirMin:30,lembretes:true,notif:false}};
const ui={tab:'hoje',hist:null,per:'7',ntNome:'',ntCat:null};
const snooze={},notif={};
let swReg=null,instalador=null;

function abrirDB(){return new Promise((res,rej)=>{
  const q=indexedDB.open('fenixTempoDB',2);
  q.onupgradeneeded=()=>{const d=q.result;['dias','cats','tarefas','regs','rotinas','rotlog'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});});if(!d.objectStoreNames.contains('cfg'))d.createObjectStore('cfg',{keyPath:'key'});};
  q.onblocked=()=>toast('Feche as outras abas do app para concluir a atualização');
  q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
});}
function tx(st,modo,fn){
  if(!db)return Promise.resolve([]);
  return new Promise((res,rej)=>{
    const t=db.transaction(st,modo);const r=fn(t.objectStore(st));
    t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
}
const putLocal=(st,o)=>tx(st,'readwrite',s=>s.put(o));
const delLocal=(st,id)=>tx(st,'readwrite',s=>s.delete(id));
const all=st=>tx(st,'readonly',s=>s.getAll());
/* put/del/clear: gravam no aparelho e empurram para a nuvem (v2.0) */
const put=(st,o)=>{empurrar(st,o);return putLocal(st,o);};
const del=(st,id)=>{empurrarDel(st,id);return delLocal(st,id);};
const clear=async st=>{if(st!=='cfg')(await all(st)).forEach(o=>empurrarDel(st,o.id));return tx(st,'readwrite',s=>s.clear());};

/* ---------- Formatação ---------- */
const pad=n=>String(n).padStart(2,'0');
function fmtDur(ms){ms=Math.max(0,ms);if(ms<MIN)return '<1min';const t=Math.round(ms/MIN),h=Math.floor(t/60),m=t%60;if(h&&m)return h+'h '+pad(m)+'min';if(h)return h+'h';return m+'min';}
function fmtClock(ms){const s=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);}
const fmtHM=ts=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fmtData=ts=>new Date(ts).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
const fmtDataHora=ts=>fmtData(ts)+' '+fmtHM(ts);
function toLocal(ts){const d=new Date(ts-new Date(ts).getTimezoneOffset()*MIN);return d.toISOString().slice(0,16);}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}

/* ---------- Acesso aos dados ---------- */
const OUTROS={id:'c_outros',nome:'Outros',cor:'#94a3b8'};
const diaAberto=()=>S.dias.find(d=>d.fim==null);
const reg=id=>S.regs.find(r=>r.id===id);
const tarefa=id=>S.tarefas.find(t=>t.id===id);
const catId=id=>S.cats.find(c=>c.id===id)||OUTROS;
function catDe(r){const t=tarefa(r.tarefaId);return catId(t?t.catId:r.catId);}
const usos=id=>S.regs.filter(r=>r.tarefaId===id).length;

function tipico(tid){
  const m={};S.regs.filter(r=>r.tarefaId===tid).forEach(r=>{(m[sessKey(r)]=m[sessKey(r)]||[]).push(r);});
  const ds=Object.values(m).filter(g=>g.every(r=>r.fim&&!r.esqueceu)&&!g.slice().sort((a,b)=>b.inicio-a.inicio)[0].pausada).map(g=>g.reduce((a,r)=>a+(r.fim-r.inicio),0)).sort((a,b)=>a-b);
  return ds.length<3?null:ds[Math.floor(ds.length/2)];
}
function limite(r){const t=tipico(r.tarefaId);return t?Math.max(t*1.5,t+10*MIN,10*MIN):S.cfg.limiteMin*MIN;}

/* ---------- Estatísticas ---------- */
function uniao(iv){
  iv=iv.filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]);
  let tot=0,cs=null,ce=null;
  for(const [s,e] of iv){if(cs===null){cs=s;ce=e;}else if(s<=ce){ce=Math.max(ce,e);}else{tot+=ce-cs;cs=s;ce=e;}}
  if(cs!==null)tot+=ce-cs;return tot;
}
function clip(r,d,now){const fim=d.fim==null?now:d.fim;return [Math.max(r.inicio,d.inicio),Math.min(r.fim==null?now:r.fim,fim)];}
function statsDia(d,now){
  now=now||agora();const fim=d.fim==null?now:d.fim;
  const regs=S.regs.filter(r=>r.diaId===d.id);
  const iv=regs.map(r=>clip(r,d,now));
  const soma=iv.reduce((a,x)=>a+Math.max(0,x[1]-x[0]),0);
  const un=uniao(iv),acordado=Math.max(0,fim-d.inicio);
  return {regs,acordado,soma,un,sem:Math.max(0,acordado-un),par:Math.max(0,soma-un),erros:regs.filter(r=>r.esqueceu)};
}
function catTotais(regs,d,now){
  const m={};
  regs.forEach(r=>{const c=catDe(r),x=clip(r,d,now),ms=Math.max(0,x[1]-x[0]);(m[c.id]=m[c.id]||{nome:c.nome,cor:c.cor,ms:0}).ms+=ms;});
  return Object.values(m).sort((a,b)=>b.ms-a.ms);
}
function barras(lista){
  const tot=lista.reduce((a,x)=>a+x.ms,0);
  if(!tot)return '<p class="mut small">Nenhuma tarefa registrada.</p>';
  return lista.map(x=>{const p=Math.round(x.ms/tot*100);return `<div class="bar"><div class="t"><span><span class="dot" style="background:${esc(x.cor)}"></span>${esc(x.nome)}</span><span class="mut">${fmtDur(x.ms)} · ${p}%</span></div><div class="tr"><i style="width:${p}%;background:${esc(x.cor)}"></i></div></div>`;}).join('');
}
function resumoHTML(d){
  const st=statsDia(d),tot=catTotais(st.regs,d,agora()),mh=metasHTML(d);
  return `<div class="grid"><div class="kpi"><span>${fmtDur(st.acordado)}</span>acordado</div><div class="kpi"><span>${fmtDur(st.soma)}</span>em tarefas</div><div class="kpi"><span>${fmtDur(st.sem)}</span>sem registro</div><div class="kpi"><span>${st.erros.length}</span>distrações</div></div>`
   +(st.par>MIN?`<p class="mut small" style="margin-bottom:8px">${fmtDur(st.par)} de tarefas rodaram em paralelo.</p>`:'')+barras(tot)
   +(mh?`<div class="sec" style="margin-top:14px">Metas do dia</div>${mh}`:'');
}

/* ---------- Metas por tarefa ---------- */
function tempoTarefaDia(tid,d,now){
  now=now||agora();
  return S.regs.filter(r=>r.diaId===d.id&&r.tarefaId===tid).reduce((a,r)=>{const x=clip(r,d,now);return a+Math.max(0,x[1]-x[0]);},0);
}
const comMeta=()=>S.tarefas.filter(t=>t.meta&&t.meta.min>0);
function metaTxt(t){return t.meta&&t.meta.min>0?(t.meta.tipo==='max'?'até ':'')+fmtDur(t.meta.min*MIN):'';}
function metaStatus(t,ms){
  const alvo=t.meta.min*MIN,max=t.meta.tipo==='max';
  return {ok:max?ms<=alvo:ms>=alvo,estourou:max&&ms>alvo,pct:Math.min(100,ms/alvo*100)};
}
function metasHTML(d,now){
  now=now||agora();
  return comMeta().map(t=>{
    const ms=tempoTarefaDia(t.id,d,now),s=metaStatus(t,ms),c=catId(t.catId),max=t.meta.tipo==='max';
    const cor=s.estourou?'var(--err)':(!max&&s.ok?'var(--ok)':esc(c.cor));
    const rot=max?(s.estourou?'passou do limite':'dentro do limite'):(s.ok?'meta cumprida ✔':'faltam '+fmtDur(t.meta.min*MIN-ms));
    return `<div class="bar"><div class="t"><span><span class="dot" style="background:${esc(c.cor)}"></span>${esc(t.nome)} <span class="mut small">${max?'máx.':'mín.'} ${fmtDur(t.meta.min*MIN)}</span></span><span class="${s.estourou?'err':(!max&&s.ok?'ok':'mut')}">${fmtDur(ms)} · ${rot}</span></div><div class="tr"><i style="width:${Math.round(s.pct)}%;background:${cor}"></i></div></div>`;}).join('');
}
function metasAoVivo(){const el=$('#metas'),d=diaAberto();if(el&&d&&ui.tab==='hoje')el.innerHTML=metasHTML(d);}
function metasRelHTML(ds,now){
  const ts=comMeta();if(!ts.length||!ds.length)return '';
  const lin=ts.map(t=>{
    let lista=ds.slice();
    const ult=lista[lista.length-1];
    if(ult.fim==null&&!metaStatus(t,tempoTarefaDia(t.id,ult,now)).ok)lista.pop(); /* hoje ainda em andamento não conta como falha */
    if(!lista.length)return `<div class="item"><div style="flex:1"><b>${esc(t.nome)}</b><div class="mut small">${t.meta.tipo==='max'?'máx.':'mín.'} ${fmtDur(t.meta.min*MIN)} por dia</div></div><span class="mut small">sem dias fechados</span></div>`;
    const res=lista.map(d=>metaStatus(t,tempoTarefaDia(t.id,d,now)).ok);
    const ok=res.filter(Boolean).length;
    let seq=0;for(let i=res.length-1;i>=0&&res[i];i--)seq++;
    const media=lista.reduce((a,d)=>a+tempoTarefaDia(t.id,d,now),0)/lista.length;

const dataKey=ts=>toLocal(ts).slice(0,10);
const DSEM=['dom','seg','ter','qua','qui','sex','sáb'];
function diasTxt(a){const s=a.slice().sort().join();return a.length===7?'todos os dias':s==='1,2,3,4,5'?'seg–sex':s==='0,6'?'fim de semana':a.slice().sort().map(d=>DSEM[d]).join(', ');}
function resumoRotina(ro){const n=ro.itens.filter(i=>i.ativo&&tarefa(i.tarefaId)).length;return n+' tarefa'+(n===1?'':'s')+' · '+(ro.horario&&ro.horario.ativo?ro.horario.hora+' ('+diasTxt(ro.horario.dias)+')':'sem horário');}
function prevDe(ro,ts){
  const hr=ro.horario;if(!hr||!hr.ativo||!hr.hora)return null;
  const dt=new Date(ts);if(!hr.dias.includes(dt.getDay()))return null;
  const p=hr.hora.split(':').map(Number);dt.setHours(p[0],p[1],0,0);return dt.getTime();
}
async function abrirReg(tid,ini){
  const d=diaAberto(),t=tarefa(tid);if(!d||!t)return null;
  if(S.regs.some(r=>!r.fim&&r.tarefaId===tid))return null;
  const r=novoReg(d,t,ini||agora());
  S.regs.push(r);await put('regs',r);return r;
}
async function iniciarRotina(rid){
  const d=diaAberto(),ro=S.rotinas.find(x=>x.id===rid);if(!d||!ro)return;
  const its=ro.itens.filter(i=>i.ativo&&tarefa(i.tarefaId));
  if(!its.length){toast('Esta rotina não tem tarefas marcadas');return;}
  const now=agora(),seq=its.filter(i=>i.modo==='seq').map(i=>i.tarefaId);
  for(const i of its.filter(i=>i.modo!=='seq'))await abrirReg(i.tarefaId,now);
  let prox=0;if(seq.length){await abrirReg(seq[0],now);prox=1;}
  const prev=prevDe(ro,now),log={id:prev?'L_'+ro.id+'_'+dataKey(now):'L_'+uid(),rotinaId:ro.id,nome:ro.nome,diaId:d.id,previsto:prev,iniciouEm:now,atrasoMs:prev?Math.max(0,now-prev):0,seq,prox,pulou:false};
  S.rotlog=S.rotlog.filter(x=>x.id!==log.id);S.rotlog.push(log);await put('rotlog',log);
  fechar();render();
  toast('Rotina “'+ro.nome+'” iniciada'+(log.atrasoMs>=MIN?' · atraso de '+fmtDur(log.atrasoMs):''));
}
function rotinasAtrasadas(){
  const d=diaAberto();if(!d)return [];const now=agora(),out=[];
  S.rotinas.forEach(ro=>{
    const prev=prevDe(ro,now);if(!prev||now<prev||prev<d.inicio-2*3600000)return;
    if(S.rotlog.some(l=>l.id==='L_'+ro.id+'_'+dataKey(now)))return;
    if(snooze['rot_'+ro.id]&&now<snooze['rot_'+ro.id])return;
    if(!ro.itens.some(i=>i.ativo&&tarefa(i.tarefaId)))return;
    out.push({ro,prev,atraso:now-prev});
  });
  return out;
}

function aposEncerrar(r){

function promptProx(l,anterior,fim){

   <button class="btn gold block" onclick="rotProx('${l.id}','agora')">Iniciar agora</button>
   ${fim&&agora()-fim>=MIN?`<button class="btn block" onclick="rotProx('${l.id}','fim')">Começou quando a anterior terminou (${fmtHM(fim)})</button>`:''}
   <button class="btn block" onclick="rotProx('${l.id}','pular')">Pular esta tarefa</button><button class="link" onclick="fechar()">Depois</button>`);

async function rotProx(lid,acao){
  const l=S.rotlog.find(x=>x.id===lid);if(!l)return;
  while(l.prox<l.seq.length&&!tarefa(l.seq[l.prox]))l.prox++;
  if(l.prox>=l.seq.length){fechar();render();return;}
  const tid=l.seq[l.prox];
  if(acao!=='pular'){
    let ini=agora();
    if(acao==='fim'){const pr=S.regs.filter(x=>x.diaId===l.diaId&&x.tarefaId===l.seq[l.prox-1]&&x.fim).sort((a,b)=>b.fim-a.fim)[0];if(pr)ini=pr.fim;}
    await abrirReg(tid,ini);
  }
  l.prox++;await put('rotlog',l);fechar();render();
  if(acao==='pular'&&l.prox<l.seq.length)promptProx(l,null,null);
}

async function finalizar(r,fim,esq){

  r.esqueceu=!!esq&&atraso>=MIN;r.atrasoMs=r.esqueceu?atraso:0;await put('regs',r);

}

  const [h,m]=v.split(':').map(Number),now=agora(),d=new Date(now);d.setHours(h,m,0,0);
  let ts=d.getTime();if(ts>now)ts-=DIA;

   +(pzn?`<p class="mut small" style="margin:8px 0">${pzn} tarefa${pzn===1?'':'s'} pausada${pzn===1?'':'s'}: ao dormir, ${pzn===1?'fica concluída':'ficam concluídas'} com o tempo acumulado.</p>`:'')

async function confirmarDormir(){
  const d=diaAberto();if(!d)return;
  let ts=new Date($('#dormi').value).getTime();
  const maxFim=Math.max(d.inicio,...S.regs.filter(r=>r.diaId===d.id&&r.fim).map(r=>r.fim));
  if(!ts||isNaN(ts)){erro('Informe o horário.');return;}
  if(ts<maxFim&&maxFim-ts<MIN)ts=maxFim; /* o campo corta os segundos */
  if(ts<maxFim){erro('O horário é anterior ao término da última tarefa ('+fmtHM(maxFim)+').');return;}
  if(ts>agora()+MIN){erro('O horário está no futuro.');return;}
  d.fim=ts;await put('dias',d);
  for(const r of pausadasDia(d)){r.pausada=false;await put('regs',r);}
  modal(`<h3>Dia encerrado ✔</h3><p class="mut small" style="margin-bottom:10px">${fmtData(d.inicio)} · ${fmtHM(d.inicio)} → ${fmtHM(d.fim)}</p>${resumoHTML(d)}<button class="btn gold block" onclick="fechar()">Fechar</button>`);
  render();
}

  modal(`<h3>Corrigir tarefa</h3>

   <label>Fim (vazio = ainda em andamento)</label><input type="datetime-local" id="e_f" value="${r.fim?toLocal(r.fim):''}">
   <label class="sw" style="color:var(--txt);font-size:15px"><span>Contar como esquecimento</span><input type="checkbox" id="e_e" ${r.esqueceu?'checked':''}></label>
   <div class="erro" id="err"></div>
   <button class="btn gold block" onclick="salvarReg('${id}')">Salvar</button>
   <button class="btn danger block" onclick="excluirReg('${id}')">Excluir registro</button><button class="link" onclick="fechar()">Cancelar</button>`);

async function salvarReg(id){
  const r=reg(id);if(!r)return;
  const ini=new Date($('#e_i').value).getTime(),fv=$('#e_f').value,fim=fv?new Date(fv).getTime():null;
  if(!ini||isNaN(ini)){erro('Informe o início.');return;}
  if(fim!==null&&(isNaN(fim)||fim<=ini)){erro('O fim precisa ser depois do início.');return;}
  if(fim!==null&&fim>agora()+MIN){erro('O fim está no futuro.');return;}
  const tid=$('#e_t').value;
  if(tid&&tid!==r.tarefaId){const t=tarefa(tid);r.tarefaId=tid;r.nome=t.nome;r.catId=t.catId;delete r.sessaoId;delete r.retomaDe;}
  r.inicio=ini;
  if(fim===null){r.fim=null;r.esqueceu=false;r.marcadoEm=null;r.atrasoMs=0;r.pausada=false;}
  else{
    if(!r.marcadoEm)r.marcadoEm=agora();
    r.fim=fim;
    if($('#e_e').checked&&r.marcadoEm-fim>=MIN){r.esqueceu=true;r.atrasoMs=r.marcadoEm-fim;}else{r.esqueceu=false;r.atrasoMs=0;}
  }
  await put('regs',r);fechar();render();
}
async function excluirReg(id){

  S.regs=S.regs.filter(r=>r.id!==id);await del('regs',id);fechar();render();
}

async function salvarDia(id){
  const d=S.dias.find(x=>x.id===id);if(!d)return;
  const ini=new Date($('#d_i').value).getTime(),fv=$('#d_f').value,fim=d.fim?new Date(fv).getTime():null;

async function excluirDia(id){

/* ---------- Tela: Histórico ---------- */
function renderHist(){
  if(ui.hist)return renderDia(ui.hist);
  const ds=S.dias.slice().sort((a,b)=>b.inicio-a.inicio);
  $('#view').innerHTML=ds.length?ds.map(d=>{const st=statsDia(d);
    return `<div class="card tap" onclick="verDia('${d.id}')"><div class="row"><b>${fmtData(d.inicio)}</b><span class="mut">${fmtHM(d.inicio)} → ${d.fim?fmtHM(d.fim):'em aberto'}</span></div><div class="mut small">Acordado ${fmtDur(st.acordado)} · ${st.regs.length} tarefa${st.regs.length===1?'':'s'} · ${st.erros.length} distraç${st.erros.length===1?'ão':'ões'}</div></div>`;}).join('')
   :`<div class="empty">Seus dias aparecerão aqui depois do primeiro “Acordei”.</div>`;
}
function renderDia(id){
  const d=S.dias.find(x=>x.id===id);if(!d){ui.hist=null;return renderHist();}
  const now=agora(),st=statsDia(d,now),fim=d.fim==null?now:d.fim,span=Math.max(fim-d.inicio,MIN);
  const regs=st.regs.slice().sort((a,b)=>a.inicio-b.inicio),lanes=[];
  const segs=regs.map(r=>{const x=clip(r,d,now);let l=lanes.findIndex(e=>e<=x[0]);if(l<0){l=lanes.length;lanes.push(0);}lanes[l]=x[1];
    const c=catDe(r),left=(x[0]-d.inicio)/span*100,w=Math.max(.8,(x[1]-x[0])/span*100);
    return `<div class="seg${r.fim?'':' aberta'}" style="left:${left}%;width:${w}%;top:${4+l*26}px;background:${esc(c.cor)}" title="${esc(r.nome)} ${fmtHM(r.inicio)}–${r.fim?fmtHM(r.fim):'agora'}" onclick="abrirEditarReg('${r.id}')">${esc(r.nome)}</div>`;}).join('');
  const horas=Math.max(1,Math.round(span/3600000)),passo=Math.max(1,Math.ceil(horas/7));let ticks='';
  const h0=new Date(d.inicio);h0.setMinutes(0,0,0);
  for(let t=h0.getTime()+3600000;t<fim;t+=3600000){const k=Math.round((t-h0.getTime())/3600000);if(k%passo)continue;const p=(t-d.inicio)/span*100;if(p>3&&p<97)ticks+=`<span style="left:${p}%">${pad(new Date(t).getHours())}h</span>`;}
  let h=`<button class="btn small" onclick="ui.hist=null;render()">← Voltar</button>
   <div class="card" style="margin-top:12px"><div class="row"><div><b style="font-size:18px">${fmtData(d.inicio)}</b><div class="mut small">${fmtHM(d.inicio)} → ${d.fim?fmtHM(d.fim):'em aberto'}</div></div><button class="btn small" onclick="abrirEditarDia('${d.id}')">Corrigir dia</button></div></div>
   <div class="card">${resumoHTML(d)}</div>
   <div class="card"><h3>Linha do tempo</h3><div class="tl" style="height:${lanes.length*26+8}px">${segs}</div><div class="axis">${ticks}</div></div>
   <div class="sec">Tarefas do dia</div><div class="card" style="padding:4px 14px">`;
  h+=regs.length?regs.map(r=>{const c=catDe(r);
    return `<div class="item" style="cursor:pointer" onclick="abrirEditarReg('${r.id}')"><div style="flex:1"><span class="dot" style="background:${esc(c.cor)}"></span><b>${esc(r.nome)}</b><div class="mut small">${fmtHM(r.inicio)}–${r.fim?fmtHM(r.fim):'agora'} · ${fmtDur((r.fim||now)-r.inicio)}</div></div>${r.esqueceu?`<span class="badge">esqueceu · ${fmtDur(r.atrasoMs)}</span>`:''}${pausaBadge(r)}</div>`;}).join(''):`<div class="empty">Sem tarefas neste dia.</div>`;
  $('#view').innerHTML=h+'</div>';
}

/* ---------- Tela: Relatórios ---------- */
function diasPeriodo(){
  const ds=S.dias.slice().sort((a,b)=>a.inicio-b.inicio),now=agora();
  if(ui.per==='dia')return ds.slice(-1);
  if(ui.per==='tudo')return ds;
  return ds.filter(d=>d.inicio>=now-Number(ui.per)*DIA);
}
function renderRel(){
  const ds=diasPeriodo(),now=agora();
  const chips=[['dia','Último dia'],['7','7 dias'],['30','30 dias'],['tudo','Tudo']].map(p=>`<button class="chip${ui.per===p[0]?' on':''}" onclick="ui.per='${p[0]}';render()">${p[1]}</button>`).join('');
  let h=`<div class="chips">${chips}</div>`;
  if(!ds.length){$('#view').innerHTML=h+`<div class="empty">Sem dados neste período.</div>`;return;}
  let ac=0,so=0,sem=0,par=0;const regs=[],porCat={};
  ds.forEach(d=>{const st=statsDia(d,now);ac+=st.acordado;so+=st.soma;sem+=st.sem;par+=st.par;st.regs.forEach(r=>regs.push(r));
    catTotais(st.regs,d,now).forEach(c=>{(porCat[c.nome+c.cor]=porCat[c.nome+c.cor]||{nome:c.nome,cor:c.cor,ms:0}).ms+=c.ms;});});
  h+=`<div class="card" style="margin-top:10px"><h3>Visão geral · ${ds.length} dia${ds.length===1?'':'s'}</h3><div class="grid"><div class="kpi"><span>${fmtDur(ac)}</span>acordado</div><div class="kpi"><span>${fmtDur(so)}</span>em tarefas</div><div class="kpi"><span>${fmtDur(sem)}</span>sem registro</div><div class="kpi"><span>${fmtDur(par)}</span>em paralelo</div></div>
   <p class="mut small">“Em tarefas” soma cada tarefa; “sem registro” é o tempo acordado sem nenhuma tarefa aberta; “em paralelo” é a sobreposição.</p></div>
   <div class="card"><h3>Por categoria</h3>${barras(Object.values(porCat).sort((a,b)=>b.ms-a.ms))}</div>`;
  h+=compRelHTML(ds,now);
  h+=metasRelHTML(ds,now);
  h+=rotRelHTML(ds);
  const porTar={};
  regs.forEach(r=>{const x=(porTar[r.tarefaId||r.nome]=porTar[r.tarefaId||r.nome]||{nome:r.nome,ms:0,n:0});x.ms+=Math.max(0,(r.fim||now)-r.inicio);x.n+=r.retomaDe?0:1;});
  const top=Object.values(porTar).sort((a,b)=>b.ms-a.ms).slice(0,8);
  h+=`<div class="card"><h3>Tarefas que mais tomam tempo</h3>`+top.map(x=>`<div class="item"><div style="flex:1"><b>${esc(x.nome)}</b><div class="mut small">${x.n} vez${x.n===1?'':'es'}</div></div><b>${fmtDur(x.ms)}</b></div>`).join('')+`</div>`;
  /* Disciplina */
  const fech=regs.filter(r=>r.fim&&!r.pausada),erros=fech.filter(r=>r.esqueceu).sort((a,b)=>b.fim-a.fim);
  const atTot=erros.reduce((a,r)=>a+r.atrasoMs,0),acerto=fech.length?Math.round((fech.length-erros.length)/fech.length*100):100;
  const maior=erros.reduce((a,r)=>Math.max(a,r.atrasoMs),0);
  h+=`<div class="sec">Disciplina</div><div class="card"><div class="grid"><div class="kpi"><span>${acerto}%</span>encerradas na hora</div><div class="kpi"><span>${erros.length}</span>distrações</div><div class="kpi"><span>${erros.length?fmtDur(atTot/erros.length):'—'}</span>atraso médio</div><div class="kpi"><span>${erros.length?fmtDur(maior):'—'}</span>maior atraso</div></div>`;
  if(ds.length>1){
    const last=ds.slice(-14),cont=last.map(d=>S.regs.filter(r=>r.diaId===d.id&&r.esqueceu).length),mx=Math.max(1,...cont);
    h+=`<div class="mut small">Distrações por dia</div><div class="trend">`+last.map((d,i)=>`<div><span>${cont[i]||''}</span><i style="height:${cont[i]/mx*72}%"></i><span>${pad(new Date(d.inicio).getDate())}/${pad(new Date(d.inicio).getMonth()+1)}</span></div>`).join('')+`</div>`;
  }
  const rank={};erros.forEach(r=>{const x=(rank[r.nome]=rank[r.nome]||{n:0,ms:0});x.n++;x.ms+=r.atrasoMs;});
  const rk=Object.entries(rank).sort((a,b)=>b[1].n-a[1].n).slice(0,5);
  if(rk.length)h+=`<div class="mut small" style="margin-top:14px">Tarefas mais esquecidas</div>`+rk.map(([n,x])=>`<div class="item"><div style="flex:1"><b>${esc(n)}</b></div><span class="mut">${x.n}× · ${fmtDur(x.ms)} de atraso</span></div>`).join('');
  h+=`</div>`;
  h+=`<div class="card"><h3>Do feito ao registro</h3><p class="mut small" style="margin-bottom:6px">Para cada esquecimento: quando terminou de verdade, quando foi registrado e quanto tempo passou.</p>`
   +(erros.length?erros.slice(0,30).map(r=>`<div class="item"><div style="flex:1"><b>${esc(r.nome)}</b><div class="mut small">${fmtDataHora(r.fim)} → registrado ${fmtDataHora(r.marcadoEm)}</div></div><span class="badge">${fmtDur(r.atrasoMs)}</span></div>`).join(''):`<div class="empty">Nenhuma distração no período. 👏</div>`)+`</div>`;
  $('#view').innerHTML=h;
}

async function setCfg(k,v){S.cfg[k]=v;await put('cfg',{key:k,value:v});}
async function ativarNotif(el){
  if(!el.checked){await setCfg('notif',false);return;}
  const p=await Notification.requestPermission();
  if(p==='granted'){await setCfg('notif',true);toast('Notificações ativadas');}else{el.checked=false;await setCfg('notif',false);toast('Permissão negada pelo navegador');}
}
async function addCat(){const n=$('#nc_nome').value.trim();if(!n)return;const c={id:uid(),nome:n,cor:$('#nc_cor').value};S.cats.push(c);await put('cats',c);render();}
async function editCat(id,k,v){const c=S.cats.find(x=>x.id===id);if(!c)return;if(k==='nome'&&!v.trim())return render();c[k]=v.trim?v.trim():v;await put('cats',c);render();}
async function delCat(id){
  if(!confirm('Excluir a categoria? As tarefas dela vão para “Outros”.'))return;
  for(const t of S.tarefas.filter(t=>t.catId===id)){t.catId='c_outros';await put('tarefas',t);}
  for(const r of S.regs.filter(r=>r.catId===id)){r.catId='c_outros';await put('regs',r);}
  S.cats=S.cats.filter(c=>c.id!==id);await del('cats',id);render();
}
async function addTar(){const n=$('#nt_nome').value.trim();if(!n)return;if($('#nt_cat').value==='__nova'){ui.ntNome=n;abrirNovaCat({tipo:'nt'});return;}if(S.tarefas.some(t=>t.nome.toLowerCase()===n.toLowerCase())){toast('Essa tarefa já existe');return;}const t={id:uid(),nome:n,catId:$('#nt_cat').value};S.tarefas.push(t);await put('tarefas',t);ui.ntNome='';ui.ntCat=null;render();}
async function editTar(id,v){const t=tarefa(id);if(!t||!v.trim())return render();t.nome=v.trim();await put('tarefas',t);for(const r of S.regs.filter(r=>r.tarefaId===id)){r.nome=t.nome;await put('regs',r);}render();}
async function catTar(id,v){const t=tarefa(id);if(!t)return;if(v==='__nova'){render();abrirNovaCat({tipo:'tarefa',id});return;}t.catId=v;await put('tarefas',t);for(const r of S.regs.filter(r=>r.tarefaId===id)){r.catId=v;await put('regs',r);}render();}
async function delTar(id){
  if(S.regs.some(r=>r.tarefaId===id&&!r.fim)){toast('Encerre a tarefa antes de excluí-la');return;}
  if(!confirm('Excluir a tarefa da lista? Os registros antigos continuam no histórico.'))return;

}
async function instalar(){if(!instalador)return;instalador.prompt();await instalador.userChoice;instalador=null;render();}

/* ---------- Backup ---------- */
function baixar(nome,conteudo,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
const hoje=()=>new Date().toISOString().slice(0,10);
function exportarJSON(){baixar(`Fenix_Gestor_de_Tempo_backup_${hoje()}.json`,JSON.stringify({app:'fenix-tempo',versao:VERSAO,dias:S.dias,cats:S.cats,tarefas:S.tarefas,regs:S.regs,rotinas:S.rotinas,rotlog:S.rotlog,cfg:S.cfg},null,1),'application/json');}
function exportarCSV(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',dt=t=>t?new Date(t).toLocaleString('pt-BR'):'';
  const ln=['Dia;Tarefa;Categoria;Início;Fim;Duração (min);Esqueceu;Atraso (min)'];
  S.regs.slice().sort((a,b)=>a.inicio-b.inicio).forEach(r=>{const d=S.dias.find(x=>x.id===r.diaId);
    ln.push([q(d?fmtData(d.inicio):''),q(r.nome),q(catDe(r).nome),q(dt(r.inicio)),q(dt(r.fim)),r.fim?Math.round((r.fim-r.inicio)/MIN):'',r.esqueceu?'sim':'não',r.esqueceu?Math.round(r.atrasoMs/MIN):0].join(';'));});
  baixar(`Fenix_Gestor_de_Tempo_registros_${hoje()}.csv`,'\ufeff'+ln.join('\r\n'),'text/csv;charset=utf-8');
}
async function importarJSON(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text()),ok=/^[\w-]+$/;
    if(j.app!=='fenix-tempo'||!Array.isArray(j.dias)||!Array.isArray(j.regs)||!Array.isArray(j.cats)||!Array.isArray(j.tarefas))throw 0;
    if((j.rotinas&&!Array.isArray(j.rotinas))||(j.rotlog&&!Array.isArray(j.rotlog)))throw 0;
    if([...j.dias,...j.regs,...j.cats,...j.tarefas,...(j.rotinas||[]),...(j.rotlog||[])].some(o=>!o||!ok.test(o.id)))throw 0;
    if(!confirm('Importar vai SUBSTITUIR todos os dados atuais.'+(Sync.mod?'\n\nA sincronização está ativa: isso também substitui os dados na nuvem e nos seus outros aparelhos.':'')+'\n\nContinuar?'))return;
    const SS=['dias','cats','tarefas','regs','rotinas','rotlog'];
    for(const st of SS)await clear(st);
    for(const st of SS)for(const o of (j[st]||[]))await put(st,o);
    S.dias=j.dias;S.cats=j.cats;S.tarefas=j.tarefas;S.regs=j.regs;S.rotinas=j.rotinas||[];S.rotlog=j.rotlog||[];
    if(!S.cats.some(c=>c.id==='c_outros')){S.cats.push({...OUTROS});await put('cats',{...OUTROS});}
    if(j.cfg&&typeof j.cfg==='object'){for(const k of ['limiteMin','repetirMin','lembretes','notif'])if(k in j.cfg){S.cfg[k]=j.cfg[k];await put('cfg',{key:k,value:j.cfg[k]});}}
    ui.hist=null;toast('Backup importado');render();
  }catch(e){toast('Arquivo inválido');}
}
async function apagarTudo(){
  if(!confirm(Sync.mod?'Apagar TODOS os dados? A sincronização está ativa: isso apaga também na nuvem e em TODOS os seus aparelhos. Não pode ser desfeito.':'Apagar TODOS os dados do app neste aparelho? Isso não pode ser desfeito.'))return;
  if(!confirm('Tem certeza? Faça um backup antes se precisar.'))return;
  for(const st of ['dias','cats','tarefas','regs','rotinas','rotlog','cfg'])await clear(st);
  S.dias=[];S.cats=[];S.tarefas=[];S.regs=[];S.rotinas=[];S.rotlog=[];await semear();ui.hist=null;render();toast('Dados apagados');
}

function checar(){

  vencidas().filter(r=>!ids.has(r.id)).forEach(r=>{if(now-(notif[r.id]||0)>=S.cfg.repetirMin*MIN){notif[r.id]=now;notificar('Fênix · '+r.nome,'Aberta há '+fmtDur(sessaoMs(r,now))+'. Já terminou?',r.id);}});
}

   <p style="margin:10px 0">Cronometra o dia do <b>Acordei</b> ao <b>Dormir</b> e cada tarefa no meio, com encerramento manual e controle de esquecimentos.</p>
   <h3 style="font-size:16px;margin-top:14px">Changelog</h3>
   <p><b>v2.1</b> — janelas mais seguras</p><ul class="cl"><li>Toda janela agora tem um ✕ para fechar. Tocar fora dela ou rolar para cima não fecha mais nem atualiza a tela.</li></ul><p style="margin-top:12px"><b>v2.0</b> — vários aparelhos, uma conta</p><ul class="cl"><li>Entre com a conta do Fênix Core (☁ no topo). O que você inicia, pausa ou encerra em um aparelho aparece no outro em tempo real.</li><li>Tarefas iniciadas em outro aparelho mostram “iniciada em Tablet”; dê um nome a cada aparelho na tela da conta.</li><li>Na primeira entrada, os dados que já estão no aparelho sobem para a nuvem sem duplicar (tarefas e categorias com o mesmo nome são unidas).</li><li>Funciona sem internet: o que for feito offline sobe sozinho quando a conexão volta. Em edições simultâneas vale a última alteração.</li><li>Relógios dos aparelhos são alinhados pelo horário do servidor.</li><li>Seus dados são privados da sua conta. Lembretes e avisos de rotina continuam só com o app aberto.</li></ul><p style="margin-top:12px"><b>v1.4</b> — pausa e categorias livres</p><ul class="cl"><li>Pausar e retomar: a tarefa em andamento ganhou o botão ⏸ Pausar. Ela vai para “Pausadas” com o tempo acumulado, e dali você retoma (▶) ou conclui. Retomar de novo soma ao que já foi feito.</li><li>O tempo pausado não conta como tempo da tarefa (nem para metas e relatórios) e aparece como “sem registro”. Lembretes, tempo típico e “quantas vezes” usam a soma da sessão inteira.</li><li>Pausadas ficam no topo da lista de iniciar; tocar em uma retoma. Ao dormir, as pausadas ficam concluídas com o tempo acumulado.</li><li>Categorias novas direto no fluxo: ao criar uma tarefa em Iniciar tarefa há “+ Nova categoria” (nome e cor), e os seletores de categoria em Ajustes ganharam “+ Nova categoria…”.</li></ul><p style="margin-top:12px"><b>v1.3</b> — rotinas</p><ul class="cl"><li>Modelos de rotina (Ajustes › Rotinas): marque quais tarefas fazem parte; cada uma pode começar “junto” com a rotina ou “em sequência”, na ordem da lista. Desmarcar o check tira a tarefa da rotina sem apagar nada.</li><li>Na sequência, ao encerrar uma tarefa o app oferece a próxima: iniciar agora, iniciar a partir do término da anterior, pular ou deixar para depois (fica em “Rotinas em andamento”).</li><li>Rotina com horário e dias da semana: com o app aberto e o dia iniciado, avisa “atrasada há X min” com Iniciar agora, Adiar 10 min e Hoje não.</li><li>Relatórios: atraso médio e quantas vezes cada rotina com horário foi iniciada ou pulada. Backup inclui rotinas.</li><li>Banco de dados atualizado para a versão 2 sem perder nenhum registro.</li></ul><p style="margin-top:12px"><b>v1.2</b> — refinando o dia a dia</p><ul class="cl"><li>Aviso de limite: quando uma meta “no máximo” estoura com a tarefa ainda rodando (ex.: TV), aparece um alerta com Encerrar / “Ainda estou nisso”, e a notificação do sistema, se ativada.</li><li>Tarefas favoritas: toque na ☆ em Ajustes › Tarefas e ela vira um atalho ▶ na tela Hoje, que inicia a tarefa com um toque. Favoritas também ficam no topo da lista de iniciar.</li><li>Relatórios: comparação das médias por dia com o período anterior (7 ou 30 dias), por categoria, incluindo as distrações. O dia em andamento fica de fora por ser parcial.</li></ul><p style="margin-top:12px"><b>v1.1</b> — metas por tarefa e ícone oficial</p><ul class="cl"><li>Metas diárias por tarefa: “pelo menos” (ex.: estudar 2h) ou “no máximo” (ex.: TV até 1h), definidas em Ajustes › Tarefas (botão 🎯).</li><li>Card “Metas de hoje” na tela Hoje, com barra de progresso ao vivo, e metas no resumo do dia (Dormir e Histórico).</li><li>Relatórios: dias em que cada meta foi cumprida, média diária e sequência atual; o dia em andamento não conta como falha antes de terminar.</li><li>Ícone oficial Fênix no app instalado, no cabeçalho e nas notificações.</li><li>Correção: “0 distraçãoões” agora aparece como “0 distrações” (singular e plural); cabeçalho ajustado para telas pequenas.</li></ul><p style="margin-top:12px"><b>v1.0</b> — versão inicial</p>
   <ul class="cl"><li>Botões Acordei e Dormir, com cronômetro do dia.</li><li>Várias tarefas abertas ao mesmo tempo; cada uma só termina quando você encerra.</li><li>Início de tarefa com lista, busca e criação de nova (com categoria) e opção “começou há X min”.</li><li>Ao encerrar: “encerrei agora” ou “esqueci”, informando o horário real; contador de distrações e atraso entre o feito e o registro.</li><li>Corrigir depois: editar início/fim de tarefas e do dia, mudar a tarefa, excluir.</li><li>Categorias com cores e gerenciamento de tarefas.</li><li>Lembrete suave para tarefas abertas além do tempo típico, com notificações opcionais.</li><li>Histórico com linha do tempo por dia e relatórios por período, incluindo disciplina.</li><li>Backup e restauração em JSON, exportação CSV; funciona offline e é instalável (PWA).</li></ul>
   <button class="btn gold block" onclick="fechar()">Fechar</button>`);
}

/* ---------- Sincronização multi-aparelho (v2.0) ---------- */
const CORE_URL='https://fenicris-dev.github.io/Fenix-Core/fenix-core.js',APP_ID='fenix-tempo';
const COLS=['dias','cats','tarefas','regs','rotinas','rotlog','cfg'],CFG_SYNC=['limiteMin','repetirMin','lembretes'];
const Sync={core:null,db:null,auth:null,mod:null,user:null,unsubs:[],nuvem:{},prim:{},estado:'local',msg:'',ultErro:0};
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
function disp(){
  let d=null;try{d=JSON.parse(lsGet('fenix_tempo_disp')||'null');}catch(e){}
  if(!d||!d.id){d={id:'d'+uid(),nome:''};lsSet('fenix_tempo_disp',JSON.stringify(d));}
  return d;
}
const outro=x=>!!(x&&x.dispId&&x.dispId!==disp().id);
function setEstado(e,msg){
  Sync.estado=e;Sync.msg=msg||'';
  const d=$('#nvd');if(d)d.className='s-'+e;
}
const TXT_ESTADO={local:'Somente neste aparelho',conectando:'Conectando…',ok:'Sincronizado',offline:'Sem internet — as alterações sobem quando voltar'};
const txtEstado=()=>Sync.msg||(Sync.estado==='erro'?'Erro na sincronização':(TXT_ESTADO[Sync.estado]||''));

/* fila (só para o caso de o módulo não estar carregado depois de a conta já ter sido usada aqui) */
function fila(col,id,op){
  if(!lsGet('fenix_tempo_sync_uid'))return;
  let f={};try{f=JSON.parse(lsGet('fenix_tempo_fila')||'{}');}catch(e){}
  (f[col]=f[col]||{})[id]=op;lsSet('fenix_tempo_fila',JSON.stringify(f));
}
function esvaziarFila(){
  let f={};try{f=JSON.parse(lsGet('fenix_tempo_fila')||'{}');}catch(e){}
  lsDel('fenix_tempo_fila');
  for(const col of Object.keys(f))for(const id of Object.keys(f[col])){
    if(f[col][id]==='del'){Sync.mod.excluir(col,id).catch(erroSync);continue;}
    const o=col==='cfg'?(id in S.cfg?{id,value:S.cfg[id]}:null):S[col].find(x=>x.id===id);
    if(o)Sync.mod.salvar(col,o).catch(erroSync);
  }
}
const adaptar=(col,o)=>col==='cfg'?(CFG_SYNC.includes(o.key)?{id:o.key,value:o.value}:null):o;
function empurrar(col,o){
  const x=adaptar(col,o);if(!x)return;
  if(Sync.mod)Sync.mod.salvar(col,x).catch(erroSync);else fila(col,x.id,'put');
}
function empurrarDel(col,id){
  if(col==='cfg'&&!CFG_SYNC.includes(id))return;
  if(Sync.mod)Sync.mod.excluir(col,id).catch(erroSync);else fila(col,id,'del');
}
function erroSync(e){
  const c=(e&&e.code)||'';
  if(c==='permission-denied'){setEstado('erro','Sem permissão no Firestore: publique a regra de dados_pessoais (veja Ajustes › Conta).');}
  else if(c!=='unavailable'&&Date.now()-Sync.ultErro>30000){Sync.ultErro=Date.now();toast('Sincronização: '+((e&&e.message)||c||'erro'));}
}

/* aplicar o que vem da nuvem */
const ord=o=>Array.isArray(o)?o.map(ord):(o&&typeof o==='object'?Object.keys(o).sort().reduce((a,k)=>(a[k]=ord(o[k]),a),{}):o);
const igual=(a,b)=>JSON.stringify(ord(a))===JSON.stringify(ord(b));
function aplicarDoc(col,x){
  if(col==='cfg'){
    if(!CFG_SYNC.includes(x.id)||S.cfg[x.id]===x.dados.value)return false;
    S.cfg[x.id]=x.dados.value;putLocal('cfg',{key:x.id,value:x.dados.value});return true;
  }
  const arr=S[col],i=arr.findIndex(o=>o.id===x.id),d={...x.dados,id:x.id};
  if(i>=0){
    if(igual(arr[i],d))return false;
    const o=arr[i];Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,d);putLocal(col,o);
  }else{arr.push(d);putLocal(col,d);}
  return true;
}
function removerDoc(col,id){
  if(col==='cfg')return false;
  const n=S[col].length;S[col]=S[col].filter(o=>o.id!==id);
  if(S[col].length===n)return false;
  delLocal(col,id);return true;
}
function aoNuvem(col,ms,meta){
  const mapa=Sync.nuvem[col]=Sync.nuvem[col]||new Map();let mudou=false;
  for(const x of ms){
    if(x.tipo==='removed'){mapa.delete(x.id);if(removerDoc(col,x.id))mudou=true;}
    else{mapa.set(x.id,x.dados);if(!x.pendente&&aplicarDoc(col,x))mudou=true;}
  }
  if(!meta.doCache){
    setEstado(navigator.onLine===false?'offline':'ok');
    if(!Sync.prim[col]){Sync.prim[col]=true;if(COLS.every(c=>Sync.prim[c]))mesclar();}
  }
  if(mudou)renderSoon();
}
let rTimer=null,rAdiado=false;
function renderSoon(){
  clearTimeout(rTimer);
  rTimer=setTimeout(()=>{
    const a=document.activeElement;
    if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#view').contains(a)){rAdiado=true;return;}
    render();
  },120);
}
document.addEventListener('focusout',()=>{if(rAdiado){rAdiado=false;setTimeout(render,400);}});

/* primeira sincronização deste aparelho com esta conta: envia o que só existe aqui, sem duplicar */
async function mesclar(){
  const u=Sync.user;if(!u)return;
  try{
    if(lsGet('fenix_tempo_merge_'+u.uid)){esvaziarFila();return;}
    const nuv=c=>Sync.nuvem[c]||new Map(),nn=x=>String(x||'').trim().toLowerCase();
    const mapC={},mapT={};
    S.cats.filter(c=>!nuv('cats').has(c.id)).forEach(c=>{const a=[...nuv('cats').values()].find(x=>nn(x.nome)===nn(c.nome));if(a)mapC[c.id]=a.id;});
    S.tarefas.filter(t=>!nuv('tarefas').has(t.id)).forEach(t=>{const a=[...nuv('tarefas').values()].find(x=>nn(x.nome)===nn(t.nome));if(a)mapT[t.id]=a.id;});
    const C=id=>mapC[id]||id,T=id=>mapT[id]||id;
    S.tarefas.forEach(t=>{if(mapC[t.catId])t.catId=C(t.catId);});
    S.regs.forEach(r=>{if(mapC[r.catId])r.catId=C(r.catId);if(mapT[r.tarefaId])r.tarefaId=T(r.tarefaId);});
    S.rotinas.forEach(ro=>(ro.itens||[]).forEach(i=>{if(mapT[i.tarefaId])i.tarefaId=T(i.tarefaId);}));
    S.rotlog.forEach(l=>{if(l.seq&&l.seq.some(id=>mapT[id]))l.seq=l.seq.map(T);});
    for(const id of Object.keys(mapC))await delLocal('cats',id);
    for(const id of Object.keys(mapT))await delLocal('tarefas',id);
    S.cats=S.cats.filter(c=>!mapC[c.id]);S.tarefas=S.tarefas.filter(t=>!mapT[t.id]);
    for(const c of COLS){
      if(c==='cfg'){
        const its=CFG_SYNC.filter(k=>!nuv('cfg').has(k)&&k in S.cfg).map(k=>({id:k,value:S.cfg[k]}));
        if(its.length)await Sync.mod.salvarVarios('cfg',its);
        continue;
      }
      const its=S[c].filter(o=>!nuv(c).has(o.id));
      if(its.length){await Sync.mod.salvarVarios(c,its);for(const o of its)await putLocal(c,o);}
    }
    lsSet('fenix_tempo_merge_'+u.uid,new Date().toISOString());lsSet('fenix_tempo_sync_uid',u.uid);
    if(!S.cats.length)await semear();
    esvaziarFila();renderSoon();toast('Dados sincronizados com a nuvem');
  }catch(e){erroSync(e);}
}

/* conexão */
const carregarCore=()=>window.__FENIX_CORE_TESTE?Promise.resolve({FenixCore:window.__FENIX_CORE_TESTE}):import(CORE_URL);
async function syncBoot(){
  try{Sync.core=(await carregarCore()).FenixCore;}
  catch(e){Sync.core=null;setEstado('local','Não foi possível carregar o fenix-core (sem internet?).');return;}
  const C=Sync.core;
  if(!C.initFirebaseComCache||!C.criarModuloSincronia){setEstado('erro','O fenix-core publicado ainda é anterior à v2.3. Publique o fenix-core.js v2.3.');return;}
  try{
    const r=C.initFirebaseComCache();Sync.db=r.db;Sync.auth=C.criarModuloAuth(r.app);
    Sync.auth.aoMudarEstado(u=>{
      if(u)syncIniciar(u);
      else{syncParar();if(!lsGet('fenix_tempo_login_visto')){lsSet('fenix_tempo_login_visto','1');abrirConta();}}
    });
  }catch(e){setEstado('erro',String((e&&e.message)||e));}
}
async function syncIniciar(u){
  if(Sync.user&&Sync.user.uid===u.uid&&Sync.mod)return;
  syncParar(true);
  const prev=lsGet('fenix_tempo_sync_uid');
  if(prev&&prev!==u.uid&&confirm('Este aparelho tem dados de outra conta.\n\nOK = apagar os dados deste aparelho e usar só os desta conta.\nCancelar = manter e enviar para esta conta.')){
    for(const st of ['dias','cats','tarefas','regs','rotinas','rotlog'])await tx(st,'readwrite',s=>s.clear());
    S.dias=[];S.cats=[];S.tarefas=[];S.regs=[];S.rotinas=[];S.rotlog=[];lsDel('fenix_tempo_fila');lsDel('fenix_tempo_sync_uid');
  }
  Sync.user=u;Sync.nuvem={};Sync.prim={};
  Sync.mod=Sync.core.criarModuloSincronia(Sync.db,u.uid,APP_ID);
  setEstado(navigator.onLine===false?'offline':'conectando');
  COLS.forEach(c=>Sync.unsubs.push(Sync.mod.ouvir(c,(m,meta)=>aoNuvem(c,m,meta),erroSync)));
  Sync.mod.medirRelogio().then(o=>{OFFSET=Math.abs(o)<2000?0:o;}).catch(()=>{});
  if(!disp().nome)setTimeout(()=>{if(Sync.user&&!disp().nome)abrirConta();},350);else if(ui.tab==='ajustes')render();
}
function syncParar(silencioso){
  Sync.unsubs.forEach(f=>{try{f();}catch(e){}});Sync.unsubs=[];Sync.mod=null;Sync.user=null;
  setEstado('local');if(!silencioso&&ui.tab==='ajustes')render();
}
window.addEventListener('online',()=>{if(Sync.mod)setEstado('conectando');});
window.addEventListener('offline',()=>{if(Sync.mod)setEstado('offline');});

/* conta */
function contaCardHTML(){
  const u=Sync.user;
  return `<div class="card"><h3>Conta e sincronização</h3><p class="small"><span class="dotst s-${Sync.estado}"></span>${esc(txtEstado())}</p>`
   +(u?`<p class="mut small" style="margin-top:4px">${esc(u.email)} · este aparelho: <b>${esc(disp().nome||'sem nome')}</b></p>`:`<p class="mut small" style="margin-top:4px">Entre para ver e encerrar suas tarefas em qualquer aparelho.</p>`)
   +`<button class="btn block" onclick="abrirConta()">${u?'Gerenciar conta':'Entrar na conta'}</button></div>`;
}
function abrirConta(){
  const u=Sync.user;let h=`<h3>☁ Conta e sincronização</h3>`;
  if(u){
    h+=`<p class="mut small">Conectado como</p><p><b>${esc(u.email)}</b></p><p class="small" style="margin:8px 0"><span class="dotst s-${Sync.estado}"></span>${esc(txtEstado())}</p>
     <label>Nome deste aparelho</label><input id="cn_disp" value="${esc(disp().nome)}" placeholder="Ex.: Celular S20, Tablet A16" maxlength="30" autocomplete="off">
     <p class="mut small" style="margin-top:4px">Aparece nas tarefas iniciadas aqui quando você as vê em outro aparelho.</p>
     <button class="btn gold block" onclick="salvarDisp()">Salvar</button><button class="btn block" onclick="sairConta()">Sair da conta</button><button class="link" onclick="fechar()">Fechar</button>`;
  }else if(!Sync.auth){
    h+=`<p class="${Sync.estado==='erro'?'err':'mut'}" style="margin:8px 0">${esc(txtEstado()||'Carregando…')}</p><button class="btn block" onclick="fechar();syncBoot()">Tentar de novo</button><button class="link" onclick="fechar()">Continuar sem conta</button>`;
  }else{
    h+=`<p class="mut small" style="margin-bottom:6px">Use a mesma conta do Fênix Core. Seus dados ficam privados: só você os vê.</p>
     <label>E-mail</label><input id="cn_email" type="email" autocomplete="username" inputmode="email">
     <label>Senha</label><input id="cn_senha" type="password" autocomplete="current-password">
     <div class="erro" id="err"></div><button class="btn gold block" id="cn_ok" onclick="entrarConta()">Entrar</button>
     <button class="link" onclick="esqueciSenha()">Esqueci a senha</button><button class="link" onclick="fechar()">Continuar sem conta</button>`;
  }
  modal(h);
}
const MSG_AUTH={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.','auth/network-request-failed':'Sem conexão com a internet.'};
async function entrarConta(){
  const e=$('#cn_email').value.trim(),p=$('#cn_senha').value;
  if(!e||!p){erro('Informe e-mail e senha.');return;}
  const b=$('#cn_ok');b.disabled=true;
  try{await Sync.auth.entrar(e,p);fechar();toast('Conectado');}
  catch(x){b.disabled=false;erro(MSG_AUTH[x&&x.code]||'Não foi possível entrar ('+((x&&x.code)||'erro')+').');}
}
async function esqueciSenha(){
  const e=($('#cn_email').value||'').trim();if(!e){erro('Digite seu e-mail acima.');return;}
  try{await Sync.auth.recuperarSenha(e);toast('Enviamos um e-mail para redefinir a senha');}
  catch(x){erro(MSG_AUTH[x&&x.code]||'Não foi possível enviar o e-mail.');}
}
function salvarDisp(){
  const d=disp();d.nome=($('#cn_disp').value||'').trim();lsSet('fenix_tempo_disp',JSON.stringify(d));
  fechar();render();toast('Aparelho: '+(d.nome||'sem nome'));
}
async function sairConta(){
  if(!confirm('Sair desta conta? Os dados continuam neste aparelho, mas deixam de sincronizar.'))return;
  try{await Sync.auth.sair();}catch(e){}
  fechar();render();
}

/* ---------- Inicialização ---------- */
async function semear(){
  const cats=[['c_higiene','Higiene','#3b82f6'],['c_refeicao','Refeição','#f59e0b'],['c_lazer','Lazer','#a855f7'],['c_estudo','Estudo','#10b981'],['c_trabalho','Trabalho','#6366f1'],['c_casa','Casa','#84cc16'],['c_saude','Saúde','#ef4444'],['c_descanso','Descanso','#14b8a6'],['c_outros','Outros','#94a3b8']];
  for(const [id,nome,cor] of cats){const c={id,nome,cor};S.cats.push(c);await put('cats',c);}
  const ts=[['Café da manhã','c_refeicao'],['Almoço','c_refeicao'],['Jantar','c_refeicao'],['Banho','c_higiene'],['Assistir TV','c_lazer'],['Estudar','c_estudo'],['Ler','c_estudo']];
  for(const [nome,cid] of ts){const t={id:uid(),nome,catId:cid};S.tarefas.push(t);await put('tarefas',t);}
}
async function boot(){
  try{db=await abrirDB();}catch(e){db=null;toast('Armazenamento indisponível: os dados não serão salvos');}
  if(db){
    S.dias=await all('dias');S.cats=await all('cats');S.tarefas=await all('tarefas');S.regs=await all('regs');S.rotinas=await all('rotinas');S.rotlog=await all('rotlog');
    (await all('cfg')).forEach(x=>{S.cfg[x.key]=x.value;});
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  }
  const off=Number(lsGet('fenix_relogio__'+APP_ID));if(isFinite(off)&&Math.abs(off)>=2000)OFFSET=off;
  if(!S.cats.length&&!lsGet('fenix_tempo_sync_uid'))await semear();
  render();checar();syncBoot();
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instalador=e;if(ui.tab==='ajustes')render();});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;}).catch(()=>{});}
boot();
